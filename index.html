<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script async src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
*{background:transparent}
::-webkit-scrollbar{display:none;width:0;height:0}

:root{
  --accent-rgb:84,150,96;
  --accent-light:178,208,183;
  --line-rgb:178,208,183;
  --color-main:rgba(var(--accent-rgb),0.35);
  --color-border:rgba(var(--accent-rgb),0.35);
  --color-shadow:rgba(var(--accent-rgb),0.35);
  --color-notify-main:rgb(var(--accent-rgb));
  --color-notify-shadow:rgba(var(--accent-rgb),0.35);
  --color-mainSolid:rgb(var(--accent-rgb));
  --color-tab:rgba(var(--accent-rgb),0.35);
  /* ----- PALETTE DU MENU : panneau noir + UNE couleur (celle du menu) -----
     Le fond reste noir (comme sur les captures) ; seule la couleur du menu
     change : onglet actif, ligne selectionnee, filets, interrupteur allume,
     barre de defilement. Tout est recalcule par mnApplyColor() au chargement
     puis a chaque setMenuColor. Les variables sont des triplets "r,g,b" :
     l'opacite se regle dans le CSS avec rgba(var(--mn-x-rgb),alpha).
     Valeurs ci-dessous = repli (vert du menu par defaut).
       bg   = fond de la liste (noir legerement teinte)
       acc  = couleur du menu (filets, contours, barre de defilement)
       hi   = fill eclairci (haut des degrades)   lo = fill assombri (bas)
       fill = acc assombri au besoin pour que le texte BLANC reste lisible
              dessus (onglet actif, ligne selectionnee, interrupteur allume)
       on   = acc tres lumineux, pour le texte/les icones d'accent            */
  --mn-bg-rgb:5,9,6;
  --mn-char-rgb:32,36,38;
  --mn-acc-rgb:84,150,96;
  --mn-hi-rgb:106,153,114;
  --mn-lo-rgb:37,65,42;
  --mn-fill-rgb:73,130,83;
  --mn-on-rgb:123,244,145;
  --item-height:3.33vh;
  --tabs-height:3.75vh;
  --banner-height:10.9vh;
  /* bandeau de titre ("Main Menu") SUPPRIME a la demande : hauteur 0 pour que
     la barre de defilement et la liste remontent d'elles-memes. */
  --crumb-h:0vh;
  --font:'Space Grotesk','Rubik','Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  /* police du menu et de la fiche joueur (les captures sont en Poppins) */
  --menu-font:'Poppins','Space Grotesk','Rubik','Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

/* ---------- conteneur : design JUL / Synaps (fichier index11111111.html) ---------- */
/* Fond du panneau : NOIR TRANSLUCIDE (on voit legerement a travers).
   L'ombre portee et le flou de fond sont supprimes : rien ne deborde derriere
   le menu, seul le panneau lui-meme est teinte. */
.menu-root{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:#f1f2f6;position:fixed;width:37vh;z-index:1000;border-radius:1.1vh;background:rgba(0,0,0,0.75);border:0.1vh solid rgba(255,255,255,0.12)}

/* ---------- banniere chromee "JUL MENU" (une image peut la remplacer via setBanner) ---------- */
.menu-banner{position:relative;height:var(--banner-height);overflow:hidden;border-radius:1vh 1vh 0 0;background:#050506}
.menu-banner img{position:absolute;inset:0;z-index:2;width:100%;height:100%;object-fit:cover;display:block}
.b-chrome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(112deg,transparent 0 34%,rgba(255,255,255,.10) 44%,rgba(255,255,255,.55) 49%,rgba(255,255,255,.06) 55%,transparent 64%),linear-gradient(135deg,#050506 0%,#17181c 45%,#2a2c33 62%,#0a0a0c 100%)}
.b-chrome::before{content:"";position:absolute;right:-0.9vh;top:0;bottom:0;width:13.9vh;background:linear-gradient(120deg,#e9ebf0,#6c707b 55%,#c9ccd5);clip-path:polygon(46% 0,100% 0,100% 100%,0 100%);opacity:.5}
.b-chrome::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6.5vh;background:linear-gradient(60deg,#9fa3ae,#2d2f36);clip-path:polygon(0 0,100% 0,0 100%);opacity:.35}
.b-brand{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0.2vh;transform:skewX(-7deg)}
.b-row{display:flex;align-items:center;gap:0.9vh}
.b-brand svg{width:4.3vh;height:4.3vh;filter:drop-shadow(0 0.2vh 0.55vh rgba(0,0,0,.8))}
.b-brand b{font-size:3.7vh;font-weight:900;letter-spacing:.03em;line-height:1;background:linear-gradient(180deg,#fff 0%,#d4d7e0 42%,#6b6f7b 52%,#eceef3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0.2vh 0.4vh rgba(0,0,0,.9))}
.b-brand small{font-size:1vh;font-weight:700;letter-spacing:.55em;margin-left:.55em;color:#eceef3}

/* ---------- barre de titre : SUPPRIMEE a la demande. On garde le noeud dans le DOM
   (le Lua envoie encore setBreadcrumb / renderCrumb) mais il ne rend PLUS rien. ---------- */
.menu-crumb{display:none}
.crumb-title{font-size:1.25vh;font-weight:500;letter-spacing:0.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.crumb-parent{display:none}

/* ---------- onglets : texte gris en majuscules, onglet actif en relief gris ---------- */
.menu-tabs{display:flex;height:var(--tabs-height);box-sizing:border-box;background:rgba(255,255,255,0.04);border-bottom:0.1vh solid rgba(255,255,255,0.12);overflow:hidden}
.tab-item{flex:1;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.06vh;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;white-space:nowrap;color:#5d6070;user-select:none;cursor:pointer;transition:color 0.15s,background 0.15s}
.tab-item:hover{color:#c9ccd6}
.tab-item.active{color:#fff;background:linear-gradient(180deg,#4a4b52,#2a2b30);box-shadow:inset 0 0.1vh 0 rgba(255,255,255,0.18),0 0.2vh 1vh rgba(255,255,255,0.12)}

/* ---------- barre de defilement (hors du panneau, a gauche) : son curseur suit la ligne selectionnee ---------- */
.menu-scrollbar{position:absolute;left:-1.3vh;top:calc(var(--banner-height) + var(--crumb-h) + var(--tabs-height) + 0.55vh);width:0.37vh;height:27.8vh}
.scrollbar-track{width:100%;height:100%;background:rgba(255,255,255,0.14);border-radius:0.2vh;position:relative}
.scrollbar-thumb{position:absolute;top:0;left:0;width:100%;background:rgba(255,255,255,0.8);box-shadow:0 0 0.55vh rgba(255,255,255,0.35);border-radius:0.2vh;transition:top 0.16s ease-out,height 0.16s ease-out;min-height:2.2vh}

/* ---------- liste ---------- */
.menu-body{background:transparent;overflow:hidden}
.menu-items{position:relative;max-height:31.5vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0.37vh 0}
.menu-items::-webkit-scrollbar{display:none}
/* etat "liste vide" : on livre l'explication plutot qu'un panneau avec 0/0. */
.menu-empty{position:relative;z-index:1;display:flex;flex-direction:column;gap:0.35vh;align-items:center;text-align:center;padding:1.1vh 1.6vh}
.menu-empty-title{font-size:1.15vh;font-weight:700;letter-spacing:0.08em;color:rgb(var(--mn-on-rgb))}
.menu-empty-sub,.menu-empty-hint{font-size:1vh;font-weight:500;line-height:1.5;color:rgba(255,255,255,0.8)}
/* selection : bande en degrade gris + filet lumineux continu (dessine en masque) */
.selection-highlight{position:absolute;left:0.65vh;right:0.65vh;height:var(--item-height);box-sizing:border-box;border-radius:0.83vh;
  background:linear-gradient(90deg,#6c6d75 0%,#46474d 42%,#2a2b30 100%);
  box-shadow:0 0 0.55vh rgba(255,255,255,0.16),inset 0 0 1.1vh rgba(255,255,255,0.07);
  z-index:0;pointer-events:none;will-change:top;transform:translateZ(0)}
.selection-highlight::before{content:"";position:absolute;inset:-0.1vh;padding:0.1vh;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%),linear-gradient(100deg,rgba(255,255,255,.9),rgba(255,255,255,.28) 38%,rgba(255,255,255,.28) 64%,rgba(255,255,255,.85));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.menu-item{display:flex;justify-content:space-between;align-items:center;gap:1vh;margin:0 0.65vh;padding:0 0.93vh;height:var(--item-height);box-sizing:border-box;position:relative;z-index:1;cursor:pointer;border:0.1vh solid transparent;border-bottom-color:rgba(255,255,255,0.1);border-radius:0.83vh}
.menu-item.is-selected{border-bottom-color:transparent}
.item-label{display:flex;align-items:center;gap:1vh;min-width:0;flex:1}
/* icones a gauche (le Lua envoie item.icon, ex. "ph-user") */
.row-icon{display:inline-block;flex:none;width:1.6vh;font-size:1.6vh;line-height:1;text-align:center;color:#c9ccd6}
.menu-item.is-selected .row-icon{color:#fff}
.menu-item .name{font-size:1.25vh;color:#f1f2f6;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider-val{flex:none;width:3.15vh;text-align:right;color:#6f7280;font-size:1.11vh;font-variant-numeric:tabular-nums}
.components-container{display:flex;align-items:center;gap:1vh;flex-shrink:0}
.component{display:flex;align-items:center;gap:1vh}
.caret-icon{display:flex;align-items:center;color:#8c90a0}
.caret-icon svg{width:1.4vh;height:1.4vh}
.swatch{display:block;width:1.7vh;height:1.7vh;border-radius:0.45vh;box-shadow:inset 0 0 0 0.1vh rgba(255,255,255,0.3)}
.menu-item.is-selected .name,.menu-item.is-selected .caret-icon,.menu-item.is-selected .scroll-value{color:#fff}
.menu-item.is-selected .slider-val{color:#e3e5ec}

/* ---------- interrupteur ---------- */
.toggle-switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
.toggle-switch input{position:absolute;opacity:0;width:0;height:0}
.toggle-track{display:block;width:3.33vh;height:1.85vh;background:#3a3b41;border-radius:0.93vh;position:relative;transition:background 0.18s;box-sizing:border-box}
.toggle-thumb{position:absolute;top:0.28vh;left:0.28vh;width:1.3vh;height:1.3vh;border-radius:50%;background:#f2f3f6;transition:transform 0.18s cubic-bezier(.3,.8,.3,1)}
.toggle-switch input:checked ~ .toggle-track{background:#c9cacf}
.toggle-switch input:checked ~ .toggle-track .toggle-thumb{transform:translateX(1.48vh);background:#fff}

/* ---------- curseur ---------- */
.range-component{position:relative;width:8.5vh;height:1.6vh;display:flex;align-items:center}
.range-track{position:absolute;left:0;width:100%;height:0.28vh;background:rgba(255,255,255,0.16);border-radius:0.2vh;z-index:1}
.range-fill{position:absolute;left:0;height:0.28vh;background:rgba(255,255,255,0.75);border-radius:0.2vh;z-index:2;pointer-events:none}
.range-component input[type="range"]{-webkit-appearance:none;appearance:none;position:relative;width:100%;height:0.28vh;background:transparent;outline:none;margin:0;padding:0;cursor:pointer;z-index:3}
.range-component input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:0.37vh;height:1vh;border-radius:0.2vh;background:#fff;margin-top:-0.36vh;cursor:pointer}
.range-component input[type="range"]::-moz-range-thumb{width:0.37vh;height:1vh;border-radius:0.2vh;background:#fff;border:none;cursor:pointer}

/* ---------- selecteur "— VALEUR —" ---------- */
.scroll-value{display:flex;align-items:center;gap:0.65vh;font-size:0.97vh;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9a9eae;max-width:17vh}
.scroll-value .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll-value .arrow{flex:none;font-size:0;width:0.74vh;height:0.1vh;background:currentColor;opacity:0.8}
.scroll-value.arrows .arrow{width:auto;height:auto;background:transparent}

/* ---------- separateur : filet - titre - filet ---------- */
.separator-container{display:flex;align-items:center;height:2.78vh;margin:0 0.74vh;padding:0 0.2vh;gap:1.1vh;box-sizing:border-box;background:transparent}
.separator-bar{display:block;flex:1;height:0.1vh;background:rgba(255,255,255,0.7)}
.separator-text{color:#fff;font-size:1.02vh;font-weight:600;white-space:nowrap}

/* ---------- pied : nom | logo | compteur ---------- */
.menu-footer{background:rgba(0,0,0,0.6);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:4.26vh;box-sizing:border-box;padding:0 1.3vh;border-top:0.1vh solid rgba(255,255,255,0.1);border-radius:0 0 1vh 1vh;overflow:hidden}
.footer-who{display:flex;align-items:center;gap:0.9vh;min-width:0}
/* Logo image optionnel (FOOTER_LOGO_URL / setFooterLogo) : "screen" rend le noir transparent. */
.footer-logo{display:flex;align-items:center;height:100%}
.footer-logo:empty{display:none}
.footer-logo img{height:2.2vh;width:auto;display:block;mix-blend-mode:screen}
.footer-brand{font-size:1.16vh;font-weight:600;color:#f1f2f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer-mark{display:flex;align-items:center;justify-content:center}
.footer-mark svg{width:1.85vh;height:1.85vh;opacity:0.9}
.footer-counter{justify-self:end;font-size:1.16vh;font-weight:700;font-variant-numeric:tabular-nums;color:#e3e5ec;white-space:nowrap}

/* ---------- saisie ---------- */
.input-overlay{position:fixed;top:0;left:0;transform:none;width:100%;height:100%;background:rgb(0,0,0,0.5);z-index:999999;color:white;font-weight:500;font-family:var(--font);font-size:1.2vh}
.input-box{background-color:rgba(18,19,24,0.94);border:0.1vh solid rgba(var(--line-rgb),0.5);border-radius:0.6vh;display:flex;flex-direction:column;position:fixed;bottom:17.5vh;left:50%;transform:translateX(-50%);height:auto;width:55vh;overflow:hidden;box-shadow:0 0 1.4vh rgba(var(--accent-rgb),0.35)}
.input-box > .input-header{padding:0.8vh 1vh;border-bottom:0.1vh solid rgb(var(--line-rgb));width:100%;font-size:1.2vh;font-weight:600;background:linear-gradient(90deg,rgba(var(--accent-rgb),0.45) 0%,rgba(var(--accent-rgb),0) 100%)}
.input-header-inner{display:flex;align-items:center;gap:0.5vh}
.input-header-text{color:white}
.input-box input{padding:1.25vh 1vh;border:none;outline:none;background:transparent;color:white;font-size:1.2vh;font-family:var(--font);display:block;margin:0}

/* ===== Panneau de saisie / capture de touche ("Choose Menu Key") =====
   Reproduit menu-key (1).html : la reference faisait 1126 x 95 px
   (en-tete 38 px). AGRAANDI a la demande : on est passe de 640 x 64 px
   (en-tete 24 px) a 860 x 86 px (en-tete 32 px), polices 15 -> 20 px,
   icone 22x15 -> 30x21. Tous les ratios d'origine sont conserves (echelle
   ~1.34), donc rien n'est deforme.
   Il sert MAINTENANT pour TOUTES les prompts, keybinds compris : la saisie
   n'a pas besoin de <input> (c'est le Lua qui pousse le buffer via
   updateInputPrompt, avec cursorPos), donc le rendu est identique partout.
   LA LARGEUR EST EN vw : min(860px, 66vw). Un simple width fixe serait
   ecrase par max-width sur les petits ecrans et le panneau SEMBLERAIT ne pas
   changer ; en vw il suit toutes les resolutions (66vw sur un ecran de 800px,
   plafonne a 860px au-dela de ~1300px).
   VOILE : .kb-overlay fond un rideau sombre plein ecran derriere le panneau,
   comme l'ancien .input-overlay.
   Tout le panneau est calcule a partir d'UNE couleur, celle du menu
   (--accent-rgb), via kbApplyColor().
   POSITION : centre exactement a l'ecran (place-items:center). La reference
   le collait en haut (padding-top:30px) ; ici on le veut au milieu. */
.kb-overlay{box-sizing:border-box;position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;
  pointer-events:none;display:grid;place-items:center;background:rgba(0,0,0,0.55);
  font-family:var(--font);font-weight:500;color:var(--kb-text,#fff)}
.kb-panel{box-sizing:border-box;width:min(860px,66vw);max-width:calc(100vw - 48px);height:86px;display:flex;
  flex-direction:column;overflow:hidden;background:var(--kb-panel,rgba(98,98,98,0.82));
  border:1px solid var(--kb-border,rgba(208,208,208,0.35));border-radius:6px;
  box-shadow:0 0.35vh 1.4vh rgba(0,0,0,0.55)}
.kb-head{flex:none;height:32px;display:flex;align-items:center;gap:14px;padding:0 15px;
  background:var(--kb-head,rgba(57,57,57,0.92));border-bottom:1px solid var(--kb-rule,rgba(224,224,224,0.7))}
.kb-head svg{flex:none;color:var(--kb-icon,#e5e5e5)}
.kb-divider{flex:none;width:1px;height:20px;background:var(--kb-line,rgba(255,255,255,0.14))}
.kb-title{margin:0;font-size:20px;font-weight:700;letter-spacing:0.01em;color:#fff}
.kb-value{flex:1;min-height:0;display:flex;align-items:center;padding:0 21px;font-size:20px;font-weight:700}
.kb-key{overflow:hidden;text-overflow:ellipsis;white-space:pre;display:inline-flex;align-items:center}
.kb-key.placeholder{font-weight:400;color:var(--kb-text-off,rgba(255,255,255,0.72))}
.kb-caret{flex:none;width:3px;height:23px;background:var(--kb-text,#fff);
  animation:kb-blink 1.1s steps(1) infinite}
/* le curseur ne prend sa marge que quand il est en fin de texte : au milieu
   d'un mot il doit coller au caractere, sinon tout le texte glisse de 4px */
.kb-key.kb-gap .kb-caret{margin-left:5px}
@keyframes kb-blink{50%{opacity:0}}
.kb-hint{margin-left:auto;padding-left:21px;font-size:16px;font-weight:500;white-space:nowrap;
  color:var(--kb-text-off,rgba(255,255,255,0.72))}
@media (prefers-reduced-motion:reduce){.kb-caret{animation:none}}
body,main{all:unset;display:block}

/* ---------- notifications (maquette notifications.html) ----------
   Pile en haut a droite, 340px. Tout se calcule a partir d'UNE couleur,
   celle du menu (--accent-rgb), via ntApplyColor() : fond derive + texte
   blanc/fonce selon contraste. Niveaux : info (couleur du menu), success,
   warning, error, chacun avec sa propre icone SVG. Barre de temps en bas,
   en pause au survol. duration 0 = reste jusqu'a fermeture. */
.notify-stack{position:fixed;top:calc(24px + var(--kb-hud-h,0px));right:24px;width:390px;max-width:calc(100vw - 32px);
  display:flex;flex-direction:column;gap:12px;z-index:9999;pointer-events:none;--slide:32px}
.nt-toast{--accent:var(--nt-on,#e0e0e0);position:relative;overflow:hidden;display:flex;
  align-items:flex-start;gap:14px;padding:14px 12px 17px 14px;pointer-events:auto;
  background:var(--nt-panel,rgba(98,98,98,0.88));border:1px solid var(--nt-border,rgba(208,208,208,0.35));
  border-radius:10px;animation:nt-in 0.28s ease-out both;
  font-family:var(--font);color:var(--nt-text,#fff)}
.nt-toast[data-level="success"]{--accent:var(--nt-success,#7be38b)}
.nt-toast[data-level="warning"]{--accent:var(--nt-warning,#ffcf5a)}
.nt-toast[data-level="error"]{--accent:var(--nt-error,#ff7a70)}
.nt-toast.leaving{animation:nt-out 0.22s ease-in forwards}
@keyframes nt-in{from{opacity:0;transform:translateX(var(--slide))}to{opacity:1;transform:none}}
@keyframes nt-out{from{opacity:1;transform:none}to{opacity:0;transform:translateX(var(--slide))}}
.nt-icon{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  background:rgba(0,0,0,0.28);color:var(--accent)}
.nt-icon svg{width:22px;height:22px}
.nt-body{flex:1;min-width:0;padding-top:1px}
.nt-title{margin:0;font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.nt-msg{margin:3px 0 0;font-size:14px;line-height:1.4;color:var(--nt-text-off,rgba(255,255,255,0.72));overflow-wrap:anywhere}
.nt-close{flex:none;width:28px;height:28px;border:0;border-radius:6px;background:transparent;
  color:var(--nt-text-off,rgba(255,255,255,0.72));font:400 22px/1 var(--font);cursor:pointer}
.nt-close:hover{background:rgba(0,0,0,0.25);color:var(--nt-text,#fff)}
.nt-timer{position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--accent);
  transform-origin:left center;animation:nt-shrink linear forwards}
.nt-toast:hover .nt-timer{animation-play-state:paused}
@keyframes nt-shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.nt-toast,.nt-toast.leaving,.nt-timer{animation:none}.nt-toast.leaving{opacity:0}}

/* ---------- cible (reticule overlay) ---------- */
/* Dessinee par le NUI, pas par un composant HUD : ainsi elle coexiste avec
   Remove UI, qui masque les composants 1 a 22 chaque frame.
   Disque blanc plein + croix sombre qui depasse du disque.
   La croix est APRES le disque dans le DOM : elle doit le recouvrir. */
.jul-crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:4.6vh;height:4.6vh;pointer-events:none;z-index:9998}
.jul-cross-ring{position:absolute;top:50%;left:50%;width:2.3vh;height:2.3vh;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0.55vh rgba(0,0,0,0.5)}
.jul-cross-h{position:absolute;top:50%;left:0;width:100%;height:0.28vh;background-color:#0b0b0b;transform:translateY(-50%);box-shadow:0 0 0 0.08vh rgba(255,255,255,0.5)}
.jul-cross-v{position:absolute;left:50%;top:0;width:0.28vh;height:100%;background-color:#0b0b0b;transform:translateX(-50%);box-shadow:0 0 0 0.08vh rgba(255,255,255,0.5)}

/* ---------- freecam ---------- */
.hovering-text-wrap{position:fixed;bottom:7.5vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;outline:none;min-width:18.52vh;font-family:var(--font)}
.hovering-text-list{list-style:none;margin:0;padding:0;text-align:center;pointer-events:none;user-select:none;max-height:calc(9 * (1.3vh * 1.3 + 0.37vh));overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;display:flex;flex-direction:column;align-items:center;scroll-behavior:smooth}
.hovering-text-item{padding:0.185vh 0;font-size:1.3vh;line-height:1.3;transition:transform 0.22s cubic-bezier(.2,.9,.2,1),color 0.22s cubic-bezier(.2,.9,.2,1),letter-spacing 0.22s;transform-origin:center;white-space:nowrap;min-width:27.78vh;font-weight:600;color:#fff}
.hovering-text-inactive{color:#fff;transform:scale(0.98);letter-spacing:0}
.hovering-text-selected{transform:scale(1.03);font-weight:600;letter-spacing:0.015vh;color:var(--color-mainSolid)}
li{display:list-item;text-align:-webkit-match-parent}
ul{list-style-type:disc}

/* ---------- fiche joueur ----------
   Carte d'infos qui apparait quand la selection du menu se pose sur un
   joueur de la liste. Tout le contenu vient de Lua : ce bloc ne fait que
   le poser a l'ecran. pointer-events:none, elle ne doit jamais capter un
   clic ni bloquer le menu. Fond noir, nom et barres a la couleur du menu. */
.jul-pcard{position:fixed;right:1.6vh;top:50%;transform:translateY(-50%);width:29vh;box-sizing:border-box;padding:1.6vh;display:flex;flex-direction:column;gap:1.2vh;font-family:var(--menu-font);color:#fff;pointer-events:none;z-index:9997;border-radius:2vh;background:rgba(var(--mn-bg-rgb),0.96);border:0.12vh solid rgba(var(--mn-acc-rgb),0.5);box-shadow:0 1vh 3vh rgba(0,0,0,0.65)}
.jul-pc-head{display:flex;align-items:center;gap:1.2vh}
.jul-pc-av{flex:none;width:4.4vh;height:4.4vh;box-sizing:border-box;border-radius:1vh;border:0.12vh solid rgb(var(--mn-on-rgb));background:rgba(var(--mn-acc-rgb),0.14);display:grid;place-items:center;font-size:1.5vh;font-weight:700;color:rgb(var(--mn-on-rgb))}
.jul-pc-who{flex:1;min-width:0}
.jul-pc-name{font-size:1.7vh;font-weight:700;line-height:1.15;color:rgb(var(--mn-on-rgb));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jul-pc-sub{margin-top:0.25vh;font-size:1.05vh;color:rgba(255,255,255,0.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jul-pc-badge{flex:none;box-sizing:border-box;padding:0.5vh 1.1vh;border-radius:2vh;border:0.1vh solid rgba(255,255,255,0.18);font-family:var(--mono);font-size:1.1vh;font-weight:700}
.jul-pc-stat{display:flex;flex-direction:column;gap:0.7vh}
.jul-pc-line{display:flex;justify-content:space-between;align-items:baseline;font-size:1.15vh;color:rgba(255,255,255,0.6)}
.jul-pc-line .vnum{font-family:var(--mono);font-weight:700;color:#fff}
.jul-pc-bar{display:flex;gap:0.35vh}
.jul-pc-seg{flex:1;height:0.85vh;border-radius:0.5vh;background:rgba(255,255,255,0.08)}
.jul-pc-bar.hp .jul-pc-seg.on{background:#8fd18f}
.jul-pc-bar.ap .jul-pc-seg.on{background:rgb(var(--mn-on-rgb))}
.jul-pc-sec{display:flex;flex-direction:column;border-top:0.1vh solid rgba(255,255,255,0.08)}
.jul-pc-row{display:flex;justify-content:space-between;align-items:center;gap:1vh;padding:0.95vh 0;font-size:1.15vh;border-bottom:0.1vh solid rgba(255,255,255,0.08)}
.jul-pc-row:last-child{border-bottom:none}
.jul-pc-row .k{color:rgba(255,255,255,0.6)}
.jul-pc-row .v{font-family:var(--mono);font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:15vh}
/* ---------- contour du menu : a droite (defaut), tout autour, ou aucun (setEdgeStyle) ----------
   Les ombres portees noires sont supprimees : rien ne doit apparaitre derriere le menu. */
[data-edge="all"] .menu-root{border-color:rgb(var(--mn-acc-rgb));border-width:0.3vh}
[data-edge="off"] .menu-root{border-right:0.1vh solid rgba(255,255,255,0.08)}
/* ===== Ecarts avec les captures du menu a 4 couleurs ===== */
/* valeurs "< x >" pour les listes : item.arrows = true (sinon "- x -") */
.scroll-value.arrows .arrow{font-size:0;opacity:1}
.scroll-value.arrows .arrow::before{font-size:1.15vh;font-weight:700;line-height:1}
.scroll-value.arrows .arrow:first-child::before{content:"<"}
.scroll-value.arrows .arrow:last-child::before{content:">"}
/* titre de page (setTitleStyle {style:'on'}) : barre noire, titre centre en gras */
[data-title="on"] .menu-crumb{display:flex;align-items:center;justify-content:center;height:3vh;box-sizing:border-box;background:#000}
[data-title="on"] .crumb-title{font-size:1.3vh;font-weight:700;color:#fff}
/* ancien fond noir (setBgStyle {style:'black'}) */
[data-bg="black"] .menu-body{background:rgba(var(--mn-bg-rgb),0.93)}
[data-bg="black"] .menu-tabs{background:#0b0b0d}

/* ---------- panneau Keybinds (action setKeybinds) ----------
   menu.lua envoie rows = { {label, key, state} } a chaque ouverture et a
   chaque bascule. state vaut 'on'/'off' pour les options a etat, 'none'
   pour un simple raccourci (pas de voyant invente). */
.kb-hud{position:fixed;top:24px;right:24px;z-index:9996;box-sizing:border-box;min-width:20vh;max-width:30vh;padding:1.1vh 1.3vh;display:flex;flex-direction:column;gap:0.45vh;background:rgba(var(--mn-bg-rgb),0.94);border:0.12vh solid rgba(var(--mn-acc-rgb),0.45);border-radius:0.9vh;box-shadow:0 0.8vh 2.4vh rgba(0,0,0,0.6);font-family:var(--menu-font);color:#fff;pointer-events:none}
.kb-hud-head{display:flex;align-items:center;justify-content:space-between;gap:1vh;padding-bottom:0.55vh;margin-bottom:0.15vh;border-bottom:0.1vh solid rgba(255,255,255,0.08)}
.kb-hud-title{font-size:0.95vh;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.55)}
.kb-hud-count{font-family:var(--mono);font-size:0.9vh;color:rgb(var(--mn-on-rgb))}
.kb-hud-row{display:flex;align-items:center;justify-content:space-between;gap:1.2vh;min-width:0}
.kb-hud-label{font-size:1.05vh;font-weight:500;color:rgba(255,255,255,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-hud-right{display:flex;align-items:center;gap:0.6vh;flex:none}
.kb-hud-key{font-family:var(--mono);font-size:0.9vh;font-weight:700;letter-spacing:0.03em;padding:0.28vh 0.7vh;border-radius:0.4vh;background:rgba(var(--mn-acc-rgb),0.18);border:0.1vh solid rgba(var(--mn-acc-rgb),0.5);color:rgb(var(--mn-on-rgb))}
.kb-hud-dot{width:0.7vh;height:0.7vh;border-radius:50%;background:rgba(255,255,255,0.18);box-shadow:inset 0 0 0 0.08vh rgba(255,255,255,0.25)}
.kb-hud-row[data-state="on"] .kb-hud-dot{background:#8fd18f;box-shadow:0 0 0.6vh rgba(143,209,143,0.8)}
.kb-hud-row[data-state="off"] .kb-hud-dot{background:#e0716b;box-shadow:0 0 0.6vh rgba(224,113,107,0.7)}
.kb-hud-row[data-state="none"] .kb-hud-dot{display:none}

/* ---------- ecran de chargement (showLoading / loadingProgress / hideLoading) ---------- */
.loading-overlay{position:fixed;inset:0;z-index:999998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:4vh;box-sizing:border-box;font-family:var(--menu-font);color:#fff;background:radial-gradient(120% 80% at 50% 0%,rgba(var(--mn-acc-rgb),0.22),rgba(0,0,0,0.98) 62%);transition:opacity 0.45s ease}
.loading-overlay.leaving{opacity:0;pointer-events:none}
.loading-banner{width:min(64vh,78vw);max-height:24vh;object-fit:cover;border-radius:1vh;border:0.1vh solid rgba(var(--mn-acc-rgb),0.5);box-shadow:0 1.4vh 4vh rgba(0,0,0,0.7);background:#000}
.loading-banner[hidden]{display:none}
.loading-title{font-size:2.4vh;font-weight:700;letter-spacing:0.02em;text-align:center}
.loading-title span{color:rgb(var(--mn-on-rgb))}
.loading-status{min-height:1.8vh;font-size:1.1vh;font-weight:500;letter-spacing:0.02em;color:rgba(255,255,255,0.62);text-align:center}
.loading-bar{width:min(48vh,72vw);height:0.65vh;border-radius:1vh;background:rgba(255,255,255,0.1);overflow:hidden}
.loading-fill{height:100%;width:0%;border-radius:1vh;background:linear-gradient(90deg,rgb(var(--mn-acc-rgb)),rgb(var(--mn-on-rgb)));transition:width 0.35s ease}
.loading-pct{font-family:var(--mono);font-size:1vh;font-weight:700;color:rgb(var(--mn-on-rgb))}
</style>

<body>
<div id="app"></div>
<script>
(()=>{
console.log('[JuL menu] version v15 (pont complet avec menu.lua : open/close, setData, key, keybinds, loading, theme)');
const app=document.getElementById('app');
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const E_OUT='cubic-bezier(.33,1,.68,1)',E_IN='cubic-bezier(.32,0,.67,0)';

/* ---------- transitions (équivalent de svelte/transition) ---------- */
function tr(el,{kind,dur,start=.94,x=0,y=0,base=''},out){
  const hid={opacity:0},shown={opacity:1};
  if(kind==='scale'){hid.transform=`${base} scale(${start})`;shown.transform=`${base} scale(1)`}
  if(kind==='fly'){hid.transform=`${base} translate(${x}px,${y}px)`;shown.transform=`${base} translate(0px,0px)`}
  return el.animate(out?[shown,hid]:[hid,shown],{duration:dur,easing:kind==='fade'?'linear':out?E_IN:E_OUT,fill:out?'forwards':'none'});
}
function present(s,show,build,plan){
  if(show){
    if(s.els){if(s.out){(s.anims||[]).forEach(a=>a&&a.reverse());s.out=false;s.g++}return}
    s.els=(typeof build==='function')?build():s.els;
    s.out=false;s.anims=(typeof plan==='function')?plan(s.els,false):[];
  }else if(s.els&&!s.out){
    const els=s.els,g=++s.g;s.out=true;
    /* plan peut manquer (appel a 2 arguments) : on ne doit JAMAIS lever,
       sinon s.out reste bloque true et le panneau n'est jamais retire. */
    s.anims=(typeof plan==='function')?plan(els,true):[];
    const done=()=>{if(s.g===g){els.forEach(e=>e.remove());s.els=null;s.out=false}};
    /* .then(done,done) : nettoyage aussi si une animation est annulee
       (avant : .catch(()=>{}) laissait l'etat bloque "out" a jamais). */
    Promise.all(s.anims.map(a=>a&&a.finished)).then(done,done);
  }
}

/* ================= MENU PRINCIPAL (Base) ================= */
const B={cur:0,menu:[],tabs:['Main Menu'],tab:0,crumb:[],top:'23vh',left:'6.25vh',
  banner:'',
  trackH:0,thumbTop:0,thumbH:24,over:false,hlTop:0,lock:null,rows:[],slot:{g:0}};
const live=()=>B.root&&B.root.isConnected;
const types=o=>Array.isArray(o.type)?o.type:[o.type];
const sig=o=>o.type=='divider'?'d':types(o).join(',')+(o.icon?'|i':'');

/* Aucun contenu par defaut en bas a gauche. Un logo n'apparait que si une URL
   est donnee (FOOTER_LOGO_URL dans menu.lua) : mix-blend-mode:screen est pose
   en CSS et rend le noir du fichier transparent sur le pied. Si l'image ne
   charge pas, on retombe sur le slot vide. */
function applyFooterLogo(lg,url){
  if(!lg||!url)return;
  const im=$('img');im.alt='';
  im.onerror=()=>{lg.replaceChildren();lg.classList.remove('has-img')};
  im.src=url;
  lg.replaceChildren(im);lg.classList.add('has-img');
}
function buildMenu(){
  const r=$('div','menu-root');r.style.cssText=`top:${B.top};left:${B.left};transform-origin:top left`;
  const ban=$('div','menu-banner'),img=$('img');img.alt='';
  /* banniere chromee JUL par defaut ; une image (setBanner) se pose par-dessus */
  const chrome=$('div','b-chrome');
  chrome.innerHTML='<div class="b-brand"><div class="b-row"><svg viewBox="0 0 40 40" fill="none"><path d="M14 6h20v18c0 6.6-5.4 12-12 12h-2C13.4 36 8 30.6 8 24v-2h10v2c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2V12H14z" fill="url(#jul-gm)"/><defs><linearGradient id="jul-gm" x1="6" y1="6" x2="34" y2="34"><stop stop-color="#fff"/><stop offset=".55" stop-color="#8a8e9a"/><stop offset="1" stop-color="#e6e8ee"/></linearGradient></defs></svg><b>JUL</b></div><small>MENU</small></div>';
  if(B.banner)img.src=B.banner;else img.style.display='none';
  ban.append(chrome,img);
  const crumb=$('div','menu-crumb'),tabs=$('div','menu-tabs');
  const sb=$('div','menu-scrollbar'),trk=$('div','scrollbar-track'),thumb=$('div','scrollbar-thumb');trk.append(thumb);sb.append(trk);
  const body=$('div','menu-body'),list=$('div','menu-items');list.onscroll=onScroll;
  const hl=$('div','selection-highlight');hl.style.top=B.hlTop+'px';list.append(hl);body.append(list);
  const foot=$('div','menu-footer'),cnt=$('span','footer-counter');const logo=$('span','footer-logo');
  /* Slot bas gauche laissee vide par defaut. B.logoUrl est memorise : le pied
     est reconstruit a chaque showMenu, donc la reapplication ici est ce qui
     fait survivre un logo configure. */
  if(B.logoUrl)applyFooterLogo(logo,B.logoUrl);
  const who=$('div','footer-who'),brand=$('span','footer-brand',B.userName||'JUL');who.append(logo,brand);
  const mid=$('div','footer-mark');mid.innerHTML='<svg viewBox="0 0 40 40" fill="#e3e5ec"><path d="M14 6h20v18c0 6.6-5.4 12-12 12h-2C13.4 36 8 30.6 8 24v-2h10v2c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2V12H14z"/></svg>';
  foot.append(who,mid,cnt);
  r.append(ban,crumb,tabs,sb,body,foot);app.append(r);
  Object.assign(B,{root:r,img,crumbEl:crumb,tabsEl:tabs,trackEl:trk,thumb,list,hl,cnt,logoEl:logo,brandEl:brand,rows:[]});
  renderTabs();renderCrumb();applyBar();applyBannerOffset();
  return [r];
}
const planMenu=(e,out)=>[];

function renderTabs(){
  if(!live())return;
  B.tabsEl.replaceChildren(...B.tabs.map((t,i)=>{
    const d=$('div','tab-item'+(i===B.tab?' active':''),t);
    /* clic (utile en apercu / si le focus NUI est ouvert) : on change
       d'onglet localement puis on previent menu.lua par le callback "tab". */
    d.onclick=()=>{
      if(i===B.tab)return;
      B.tab=i;renderTabs();
      postNui('tab',{index:i});
    };
    return d;
  }));
  renderCrumb();
}
function renderCrumb(){
  if(!live())return;
  const p=B.crumb,c=B.crumbEl;
  /* la barre de titre est toujours la, comme sur les captures : sans fil d'Ariane
     envoye par le Lua, elle reprend le nom de l'onglet actif */
  const title=p.length?String(p[p.length-1]):String(B.tabs[B.tab]||'Main');
  c.replaceChildren($('span','crumb-title',title));
  B.root.style.setProperty('--crumb-h',document.documentElement.dataset.title==='on'?'3vh':'0vh');
}
const comp=h=>{const d=$('div','component');d.innerHTML=h;return d};
function mkRow(o){
  if(o.type=='divider'){const d=$('div','separator-container');d.append($('div','separator-bar'),$('div','separator-text'),$('div','separator-bar'));return d}
  const r=$('div','menu-item'),lab=$('div','item-label'),cc=$('div','components-container');
  lab.append($('span','name'));if(o.icon)lab.prepend($('i','ph '+o.icon+' row-icon'));
  types(o).forEach(t=>{
    if(t==='submenu')cc.append(comp('<span class="caret-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>'));
    else if(t==='action')cc.append(comp('<span class="caret-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>'));
    else if(t==='color')cc.append(comp('<span class="swatch"></span>'));
    else if(t==='checkbox'){const c=comp('<label class="toggle-switch"><input type="checkbox"><span class="toggle-track"><span class="toggle-thumb"></span></span></label>');
      c.querySelector('input').onchange=e=>{r._o.checked=e.target.checked;if(B.cur===r._i)postNui('change',{value:e.target.checked})};cc.append(c)}
    else if(t==='slider'){const c=comp('<div class="range-component"><div class="range-track"></div><div class="range-fill"></div><input type="range"></div><span class="slider-val"></span>');
      const rg=c.querySelector('input');
      rg.oninput=e=>{r._o.value=+e.target.value;patchRow(r,r._o,r._i)};
      /* change = relachement du curseur : on previent menu.lua une seule fois
         par geste (et seulement si la ligne est bien la ligne active). */
      rg.onchange=e=>{if(B.cur===r._i)postNui('change',{value:+e.target.value})};cc.append(c)}
    else if(t==='scroll')cc.append(comp('<div class="scroll-value"><span class="arrow">-</span><span class="val"></span><span class="arrow">-</span></div>'));
  });
  r.append(lab,cc);return r;
}
function patchRow(r,o,i){
  r._o=o;r._i=i;
  if(o.type=='divider'){r.children[1].textContent=o.label??'';return}
  r.classList.toggle('is-selected',B.cur===i);
  const nm=r.querySelector('.name');nm.textContent=o.label??'';const ic=r.querySelector('.row-icon');if(ic&&o.icon)ic.className='ph '+o.icon+' row-icon';
  const sv=r.querySelector('.slider-val');if(sv)sv.textContent=o.value??'';
  const cb=r.querySelector('input[type=checkbox]');if(cb)cb.checked=!!o.checked;
  const rg=r.querySelector('input[type=range]');
  if(rg){
    [['min',o.min],['max',o.max],['step',o.step]].forEach(([k,v])=>v==null?rg.removeAttribute(k):rg.setAttribute(k,v));
    rg.value=o.value??'';
    r.querySelector('.range-fill').style.width=o.max>o.min?((o.value-o.min)/(o.max-o.min))*100+'%':'0%';
  }
  const sc=r.querySelector('.scroll-value .val');
  if(sc)sc.parentElement.classList.toggle('arrows',!!o.arrows);
  if(sc)sc.textContent=o.options?.[o.selected-1]?.label||o.options?.[0]?.label||(!o.options||o.options.length===0?'Loading...':'None');
  const sw=r.querySelector('.swatch');if(sw)sw.style.background=o.color||'#fff';
}
function renderItems(){
  if(!Array.isArray(B.menu))B.menu=[];
  B.menu.forEach((o,i)=>{
    let row=B.rows[i];
    if(!row||row._s!==sig(o)){const n=mkRow(o);n._s=sig(o);row?row.replaceWith(n):B.list.append(n);row=B.rows[i]=n}
    patchRow(row,o,i);
  });
  while(B.rows.length>B.menu.length)B.rows.pop().remove();
}
/* Liste vide : on affiche une explication au lieu d'un panneau blanc avec un
   compteur 0/0. Ce cas vient TOUJOURS du Lua (MenuConfig non charge, sanitize
   ou json.encode en echec) : le message dit donc ou aller regarder. */
function setEmptyState(on){
  if(!live())return;
  let e=B.list.querySelector('.menu-empty');
  if(!on){if(e)e.remove();return}
  if(e)return;
  e=$('div','menu-empty');
  e.append($('div','menu-empty-title','MENU VIDE (0/0)'),
           $('div','menu-empty-sub',"Le script n'a envoye aucun element."));
  e.append($('div','menu-empty-hint','Re-injecte menu.lua (voir F8).'));
  B.list.append(e);
}
function updCounter(){
  if(!Array.isArray(B.menu))B.menu=[];
  const s=B.menu.reduce((a,o,i)=>(o&&o.type!=='divider'&&a.push(i),a),[]);
  let n=0;
  if(s.length){const p=s.indexOf(B.cur);n=p!==-1?p+1:s.reduce((b,x,k)=>Math.abs(x-B.cur)<Math.abs(s[b]-B.cur)?k:b,0)+1}
  if(B.cnt)B.cnt.textContent=`${n} / ${s.length}`;
}
function applyBar(){
  if(!B.thumb)return;
  B.trackEl.style.height=B.trackH+'px';B.thumb.style.top=B.thumbTop+'px';B.thumb.style.height=B.thumbH+'px';
}
function bar(){
  if(!live()||B.lock)return;
  B.lock=requestAnimationFrame(()=>{
    B.lock=null;const L=B.list;if(!live())return;
    /* la barre couvre la hauteur de la liste ; son curseur suit la ligne SELECTIONNEE */
    B.trackH=Math.max(20,Math.round(L.clientHeight-innerHeight*0.0111));
    B.over=L.scrollHeight>L.clientHeight+1;
    const sels=(Array.isArray(B.menu)?B.menu:[]).reduce((a,o,i)=>(o&&o.type!=='divider'&&a.push(i),a),[]),n=sels.length;
    const k=Math.max(0,sels.indexOf(B.cur)),minH=Math.round(innerHeight*0.024);
    if(n<2){B.thumbH=B.trackH;B.thumbTop=0}
    else{
      B.thumbH=Math.min(B.trackH,Math.max(minH,Math.round(B.trackH/n)));
      B.thumbTop=Math.round((k/(n-1))*(B.trackH-B.thumbH));
    }
    applyBar();
  });
}
/* le curseur de la barre suit la selection (voir bar), pas le defilement */
function onScroll(){}
/* Le cadre de selection se deplace SANS animation. L'ancienne version faisait
   un h.animate() de 220 ms avec fill:'forwards' : au rythme de reponse des
   touches (85 ms) l'animation etait interrompue avant d'aller au bout, et le
   cadre restait fige sur une ancienne position, en decalage avec la ligne
   selectionnee. Le saut instantane est le seul etat toujours juste, meme en
   maintenant la touche enfoncee. */
function moveHl(t){
  const h=B.hl;if(!h){B.hlTop=t;return}
  h.getAnimations().forEach(a=>a.cancel());
  B.hlTop=t;h.style.top=t+'px';
}
const curRow=()=>B.menu[B.cur]&&B.menu[B.cur].type!='divider'?B.rows[B.cur]:null;
/* Garantit que la ligne selectionnee est TOUTE ENTIERE dans la zone visible.
   L'ancien scrollIntoView({behavior:'smooth'}) est asynchrone : au rythme de
   reponse des touches (85 ms), chaque nouvelle demande interrompt la
   precedente et la liste ne rattrape jamais -> la selection sortait de l'ecran
   et restait a moitie coupee. Ici le calcul est synchrone et deterministe. */
function ensureVisible(el){
  const L=B.list;if(!el||!L)return;
  const cs=getComputedStyle(L);
  const padT=parseFloat(cs.paddingTop)||0,padB=parseFloat(cs.paddingBottom)||0;
  const t=el.offsetTop,b=t+el.offsetHeight,vt=L.scrollTop,vb=vt+L.clientHeight;
  /* Le rembourrage de la liste (0.6vh en haut et en bas) DOIT rester visible :
     sans lui, la barre de selection vient se coller a 0,3 px du bord et se
     confondre avec le pied de page, comme si elle sortait du panneau. */
  if(t-padT<vt)L.scrollTop=Math.max(0,t-padT);
  else if(b+padB>vb)L.scrollTop=Math.max(0,b+padB-L.clientHeight);
}
function refresh(){
  if(!live())return;
  renderItems();updCounter();
  setEmptyState(!Array.isArray(B.menu)||B.menu.length===0);
  const el=curRow();if(el){moveHl(el.offsetTop);ensureVisible(el)}
  bar();
}
/* Un menu qui s'affiche signifie que l'interface est prete : on retire
   l'ecran de chargement au passage. Sans cela, si la page NUI se charge
   APRES la sequence de chargement du script, son ecran de boot (9 s de
   filet de securite) restait devant le menu : on appuyait sur la touche,
   le panneau etait bien construit... mais cache par l'overlay. */
const showMenu=()=>{hideLoading();present(B.slot,true,buildMenu,planMenu);refresh()};
/* Fermeture DETERMINISTE : le panneau est retire immediatement, sans animation
   ni etat "out" pouvant rester bloque. C'est ce qui garantit que le menu peut
   se fermer pendant qu'une notification s'affiche a cote (la fenetre NUI
   reste visible dans ce cas, donc la page doit masquer le panneau elle-meme). */
function hideMenuNow(){
  const s=B.slot;
  s.g++;                 /* invalide la suppression en attente d'un hide precedent */
  s.out=false;
  s.anims=[];
  if(s.els){s.els.forEach(e=>e.remove());s.els=null}
}

/* ================= PONT AVEC menu.lua (actions de l'interface) =================
   menu.lua pilote le menu par messages : open / close / setData / setCurrent /
   key / setKeybinds / showLoading... L'interface lui repond par les callbacks
   enregistres cote Lua (enter, back, tab, change, select, close) via post().
   Sans ce pont, les touches Entree / Retour / onglets ne faisaient rien et la
   fermeture (action "close") laissait le panneau a l'ecran. */
function postNui(name,data){
  /* En apercu navigateur (file:// ou serveur local de dev) il n'y a pas de
     ressource parente : on n'envoie rien pour ne pas polluer la console avec
     des fetch en echec. */
  if(location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')return;
  try{
    const res=(typeof GetParentResourceName==='function'&&GetParentResourceName())||'jul_menu';
    fetch('https://'+res+'/'+name,{
      method:'POST',
      headers:{'Content-Type':'application/json; charset=UTF-8'},
      body:JSON.stringify(data||{})
    }).catch(()=>{});
  }catch(_){/* environnement sans fetch : on ignore */ }
}
/* setData arrive avec { title, user, tabs = { { label, items } } }. Les items
   sont encodes par julBuildFrame qui echange volontairement checked/value
   (compatibilite de l'ancienne interface) : on les remet dans le format que
   mkRow/patchRow attendent. setCurrent, envoye juste apres, reste la source
   de verite pour le menu actif. */
function normalizeFrameItem(o){
  if(!o||typeof o!=='object')return null;
  const c=Object.assign({},o);
  if(c.checked===undefined&&typeof c.value==='boolean'){c.checked=c.value;delete c.value}
  else if(c.value===undefined&&typeof c.checked==='number'){c.value=c.checked;delete c.checked}
  return c;
}
function applyFrame(f){
  if(!f||typeof f!=='object')return;
  B.frameTitle=String(f.title||B.frameTitle||'');
  B.frameUser=String(f.user||B.frameUser||'');
  if(Array.isArray(f.tabs)&&f.tabs.length){
    B.tabs=f.tabs.map((t,i)=>String((t&&t.label)||('Tab '+(i+1))));
    if(Number.isFinite(Number(f.tabIndex)))B.tab=clamp(Math.round(Number(f.tabIndex)),0,B.tabs.length-1);
    else B.tab=clamp(B.tab,0,B.tabs.length-1);
    const tab=f.tabs[B.tab];
    const items=tab&&Array.isArray(tab.items)?tab.items:[];
    B.menu=items.map(normalizeFrameItem).filter(Boolean);
    B.cur=clamp(B.cur,0,Math.max(0,B.menu.length-1));
  }
  if(live()){renderTabs();refresh()}
}
/* Les fleches sont deja appliquees par menu.lua (il renvoie setCurrent avant
   "key") : ici seuls les gestes qui reclament un callback sont traites.
   tabNext/tabPrev n'ont pas de pendant cote Lua : l'interface change d'onglet
   puis previent le script par le callback "tab". */
function cycleTab(dir){
  if(!Array.isArray(B.tabs)||!B.tabs.length)return;
  const next=(B.tab+dir+B.tabs.length)%B.tabs.length;
  B.tab=next;renderTabs();
  postNui('tab',{index:next});
}
function onKey(k){
  if(k==='tabNext')cycleTab(1);
  else if(k==='tabPrev')cycleTab(-1);
  else if(k==='enter')postNui('enter');
  else if(k==='back')postNui('back');
}

function setLoadingWelcome(name){

function armLoadingFallback(){
  clearTimeout(LD.fallback);
  /* Filet de securite : si hideLoading s'est perdu (page chargee apres la
     sequence d'injection), l'ecran ne doit pas rester devant le jeu. */
  LD.fallback=setTimeout(()=>hideLoading(),9000);
}
function showLoading(d){
  d=d||{};

  setLoadingWelcome(d.welcome);
  if(d.banner){LD.img.src=d.banner;LD.img.hidden=false}else{LD.img.hidden=true}
  LD.pct=0;

  armLoadingFallback();

function loadingProgress(d){
  if(!LD.el)return;

  LD.fill.style.width=pct+'%';
  LD.pctEl.textContent=Math.round(pct)+'%';
  if(d&&d.status!=null)LD.statusEl.textContent=String(d.status);
  armLoadingFallback();
}
function hideLoading(){
  clearTimeout(LD.fallback);LD.fallback=null;
  if(!LD.el)return;
  const el=LD.el;
  el.classList.add('leaving');
  setTimeout(()=>{
    /* showLoading a pu reprendre la main entre-temps : on ne retire pas
       l'ecran qui vient d'etre reaffiche. */
    if(LD.el!==el||!el.classList.contains('leaving'))return;
    el.remove();
    Object.assign(LD,{el:null,img:null,titleEl:null,fill:null,pctEl:null,statusEl:null,pct:0});

}

/* ===== "Choose Menu Key" : panneau de saisie et de capture de touche =====
   Etat dedie, dans son propre slot, exactement comme la reticule : le panneau
   ne peut pas se reconstruire par accident (present() ne reverifie pas le
   builder). Il sert desormais a TOUTES les prompts, texte compris. */
const K={title:'',value:'',hint:'',mode:'typeable',cursor:0,slot:{g:0}};
const kbMix=(a,b,t)=>a.map((v,i)=>Math.round(v*(1-t)+b[i]*t));
const kbRgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a===undefined?1:a})`;
function kbApplyColor(r,g,b){
  const main=[r,g,b],black=[0,0,0],white=[255,255,255],panel=kbMix(main,black,0.35);
  const lum=c=>{const a=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
                return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]};
  /* texte blanc ou fonce selon le meilleur contraste avec le fond du panneau */
  const L=lum(panel),text=(1.05/(L+0.05))>=((L+0.05)/0.057)?[255,255,255]:[16,21,16];
  const s=document.documentElement.style;
  s.setProperty('--kb-panel',kbRgba(panel,0.82));
  s.setProperty('--kb-head',kbRgba(kbMix(main,black,0.62),0.92));
  s.setProperty('--kb-border',kbRgba(kbMix(main,white,0.55),0.35));
  s.setProperty('--kb-icon',kbRgba(kbMix(main,white,0.75)));
  s.setProperty('--kb-rule',kbRgba(kbMix(main,white,0.7),0.7));
  s.setProperty('--kb-text',kbRgba(text));
  s.setProperty('--kb-text-off',kbRgba(text,0.72));
  s.setProperty('--kb-line',kbRgba(text,0.14));
}
function kbFromAccent(){
  const raw=(getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb')||'').trim();
  const p=raw.split(/[,\s]+/).map(Number);
  kbApplyColor(isFinite(p[0])?p[0]:150,isFinite(p[1])?p[1]:150,isFinite(p[2])?p[2]:150);
}
function buildKey(){
  const ov=$('div','kb-overlay'),box=$('div','kb-panel'),head=$('div','kb-head');
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','30');svg.setAttribute('height','21');
  svg.setAttribute('viewBox','0 0 26 18');svg.setAttribute('fill','none');
  svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.5');
  svg.setAttribute('aria-hidden','true');
  svg.innerHTML='<rect x="1" y="1" width="24" height="16" rx="3.5" fill="currentColor" fill-opacity="0.25"/>'+
                '<path d="M5 6h2M9.5 6h2M14 6h2M18.5 6h2M5 9h2M9.5 9h2M14 9h2M18.5 9h2M8 13h10" stroke-linecap="round"/>';
  const ttl=$('h1','kb-title');

/* ================= FICHE JOUEUR ================= */
/* Carte d'infos affichee quand la selection du menu se pose sur un joueur
   de la liste. Lua envoie un paquet complet a chaque rafraichissement :
   ce bloc n'affiche, ne calcule et ne devine RIEN. */
/* Elle se cale sur le MENU et non sur l'ecran : on lit le rectangle reel de
   .menu-root a chaque affichage, pour que Menu Size et setMenuPos suivent
   tout seuls, sans qu'aucune largeur ait besoin d'etre devinee.
   B est declare plus bas : d'ou le typeof, un accours sans B ne doit pas
   faire echouer l'affichage de la carte. */
const PC_GAP=14, PC_M=8;
function positionPlayerCard(el){
  const c=el||(PC.slot.els&&PC.slot.els[0]);
  if(!c)return;
  const root=(typeof B!=='undefined')?B.root:null;
  const b=(root&&root.isConnected)?root.getBoundingClientRect():null;
  /* rect plutôt qu'offsetWidth : largeur fractionnaire, la cale anti-debordement
     doit se fier a la meme valeur que celle rendue par le navigateur. */
  const cr=c.getBoundingClientRect();
  const w=cr.width||c.offsetWidth||0, h=cr.height||c.offsetHeight||0;
  let x,y;
  if(b&&b.width){
    x=b.right+PC_GAP;
    y=b.top+b.height/2;   /* le CSS recentre via translateY(-50%) */
  }else{
    /* menu absent : repli sur le bord droit de l'ecran */
    x=window.innerWidth-w-PC_M;
    y=window.innerHeight/2;
  }
  /* la fiche ne doit jamais deborder a droite ni sortir verticalement */
  if(x+w>window.innerWidth-PC_M)x=Math.max(PC_M,window.innerWidth-w-PC_M);
  if(y-h/2<PC_M)y=PC_M+h/2;
  if(y+h/2>window.innerHeight-PC_M)y=Math.max(PC_M+h/2,window.innerHeight-PC_M-h/2);
  c.style.left=Math.round(x)+'px';
  c.style.right='auto';
  c.style.top=Math.round(y)+'px';
}
const PC={d:null,slot:{g:0}};
function buildPlayerCard(){
  const c=$('div','jul-pcard');
  const row=k=>`<div class="jul-pc-row"><span class="k">${k}</span><span class="v" data-k="${k}">-</span></div>`;
  const segs=Array.from({length:10},()=>'<span class="jul-pc-seg"></span>').join('');
  const stat=(f,k)=>`<div class="jul-pc-stat"><div class="jul-pc-line"><span class="k">${k}</span><span class="vnum" data-f="${f}">- / -</span></div><div class="jul-pc-bar ${f}" data-f="${f}f">${segs}</div></div>`;
  /* en-tete : initiales | nom + vehicule/arme | numero ; puis vie et armure en
     10 segments ; puis les lignes. Rien n'est devine : tout vient de Lua. */
  c.innerHTML=`
    <div class="jul-pc-head"><div class="jul-pc-av" data-k="Initials">-</div><div class="jul-pc-who"><div class="jul-pc-name" data-k="Name">-</div><div class="jul-pc-sub" data-k="Sub">-</div></div><div class="jul-pc-badge" data-k="Player ID">-</div></div>
    ${stat('hp','Health')}${stat('ap','Armor')}
    <div class="jul-pc-sec">${row('Distance')}${row('Heading')}${row('Phone')}${row('Coordinates')}</div>`;
  app.append(c);positionPlayerCard(c);return [c];
}
/* base:'translateY(-50%)' : le plan de tr() ECRASE le transform du CSS
   pendant l'entree. Sans ce base, la carte resterait 260ms avec son bord haut
   au centre de l'ecran puis "sauterait" une fois l'animation rendue. */
const planPlayerCard=(e,out)=>[tr(e[0],{kind:'fly',x:26,dur:260,base:'translateY(-50%)'},out)];
function renderPlayerCard(){
  const e=PC.slot.els,d=PC.d;if(!e)return;
  /* recale a chaque rafraichissement : le menu bouge (setMenuPos, Menu Size,
     ouverture d'un sous-menu qui change sa hauteur) */
  positionPlayerCard(e[0]);
  if(!d)return;
  const q=s=>e[0].querySelector(s);
  const set=(sel,val)=>{const n=q(sel);if(n)n.textContent=(val==null||val==='')?'-':String(val)};
  /* initiales : deux premiers mots, sinon deux premieres lettres */
  const w=String(d.name==null?'':d.name).split(/[^A-Za-z0-9\u00C0-\u024F]+/).filter(Boolean);
  set('[data-k="Initials"]',w.length>1?w[0][0]+w[1][0]:(w[0]||'').slice(0,2));
  q('[data-k="Initials"]').textContent=q('[data-k="Initials"]').textContent.toUpperCase();
  set('[data-k="Player ID"]',(d.sid==null||d.sid==='')?null:'#'+d.sid);
  set('[data-k="Name"]',d.name);
  /* sous le nom : vehicule et arme, comme "A pied - Sans arme" sur la reference */
  set('[data-k="Sub"]',[d.veh,d.wep].filter(x=>x!=null&&x!=='').join(' \u00b7 '));
  set('[data-k="Distance"]',d.dist);
  /* le degre est ecrit ICI, pas dans Lua : le fichier Lua reste en ASCII pur */
  set('[data-k="Heading"]',(d.dir?((typeof d.hdg==='number'?Math.round(d.hdg):'-')+'\u00b0 '+d.dir):'-'));
  set('[data-k="Coordinates"]',d.pos);
  /* d.num peut etre nil : set() ecrit "-" dans ce cas, jamais undefined.
     C'est le cas nominal tant que le serveur ne publie pas le numero. */
  set('[data-k="Phone"]',d.num);
  /* les barres se remplissent avec le POURCENTAGE (10 segments), l'etiquette
     montre le brut : "62 / 100", et non un pourcentage invente */
  const hpN=(typeof d.hpN==='number')?d.hpN:null;
  const apN=(typeof d.apN==='number')?d.apN:null;
  const hpMax=(typeof d.hpMax==='number'&&d.hpMax>0)?d.hpMax:100;
  const hpPct=(hpN!=null)?clamp(hpN/hpMax*100,0,100):0;
  const apPct=(apN!=null)?clamp(apN,0,100):0;
  set('[data-f="hp"]',(hpN!=null)?hpN+' / '+hpMax:'- / -');
  set('[data-f="ap"]',(apN!=null)?apN+' / 100':'- / -');
  const fillSegs=(sel,pct)=>{
    const bar=q(sel);if(!bar)return;
    const n=pct>0?Math.max(1,Math.round(pct/10)):0;
    Array.prototype.forEach.call(bar.children,(sg,i)=>sg.classList.toggle('on',i<n));
  };
  fillSegs('[data-f="hpf"]',hpPct);fillSegs('[data-f="apf"]',apPct);
}
function playerCardShow(d){
  /* Le Lua envoie les donnees IMBRIQUEES : { action, visible, data:{...} }.
     Sans cette extraction, PC.d pointe sur le conteneur et renderPlayerCard
     lit d.name / d.sid / d.hpN qui n'existent pas a ce niveau : tous les
     champs restent "-". On garde "visible" du message externe. */
  const v=d&&d.visible;
  const p=(d&&d.data)?d.data:d;
  PC.d=v?p:null;
  present(PC.slot,!!PC.d,buildPlayerCard,planPlayerCard);
  renderPlayerCard();
  if(!PC.d)return;
  /* La largeur mesuree au moment du build ne vaut que si les polices sont
     deja chargees : sinon la fiche est callee ~11px trop a droite, puis
     "saute" au premier rafraichissement. On recalle une fois le rendu final
     connu. requestAnimationFrame seuls ne suffit pas : c'est document.fonts
     qui decide. */
  requestAnimationFrame(()=>positionPlayerCard());
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>positionPlayerCard()).catch(()=>{});
}

/* ================= NOTIFICATIONS (maquette notifications.html) ================= */
/* Couleurs derivees du menu : ntApplyColor(r,g,b) recalcule --nt-panel et
   --nt-on a chaque setMenuColor. Defaut gris 150,150,150 comme le reste. */
const ntStack=$('div','notify-stack');app.append(ntStack);
const NT_LEVELS=['info','success','warning','error'];
const NT_ICONS={
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  success:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  warning:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
  error:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>'};
const ntToasts={};let ntNext=1;
const NT_MAX=5,NT_DEFAULT=5000;
function ntHsl(c){
  const r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));
    if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return [h,s,l];
}
function ntHslRgb(h,s,l){
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function ntApplyColor(r,g,b){
  const main=[r,g,b],black=[0,0,0],white=[255,255,255],panel=kbMix(main,black,0.35);
  const hsl=ntHsl(main);
  /* Gris (saturation ~0) : forcer une saturation 0.9 donnerait du rose.
     On prend un gris clair neutre, comme l'icone du panneau de touche. */
  const on=hsl[1]<0.15?kbMix(main,white,0.75):ntHslRgb(hsl[0],Math.min(1,Math.max(0.9,hsl[1])),0.78);
  const a=panel.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
  const L=0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
  const text=(1.05/(L+0.05))>=((L+0.05)/0.057)?[255,255,255]:[16,21,16];
  const s=document.documentElement.style;
  s.setProperty('--nt-panel',kbRgba(panel,0.88));
  s.setProperty('--nt-border',kbRgba(kbMix(main,white,0.55),0.35));
  s.setProperty('--nt-text',kbRgba(text));
  s.setProperty('--nt-text-off',kbRgba(text,0.72));
  s.setProperty('--nt-on',kbRgba(on));
}
/* Palette du MENU PRINCIPAL et de la fiche joueur : panneau noir + UNE couleur,
   celle du menu. Memes bases que kbApplyColor / ntApplyColor, donc tout reste
   assorti. Chaque variable est un triplet "r,g,b" ; l'opacite est reglee dans le CSS. */
function mnApplyColor(r,g,b){
  const main=[r,g,b],black=[0,0,0],white=[255,255,255];
  const lum=c=>{const a=c.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
                return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2]};
  /* une couleur presque noire disparaitrait sur le fond noir : on l'eclaircit */
  const acc=lum(main)<0.03?kbMix(main,white,0.35):main;
  /* le texte reste BLANC sur l'accent (comme sur les captures) : si la couleur est
     trop claire pour ca (jaune, blanc...), le remplissage est assombri jusqu'a ce
     que le blanc ait au moins 3,2:1 de contraste, meme sur le haut du degrade */
  let fill=acc,k=0;
  while(1.05/(lum(kbMix(fill,white,0.18))+0.05)<3.2&&k++<14)fill=kbMix(fill,black,0.07);
  /* accent tres lumineux (texte, barres) : teinte du menu. Gris -> gris clair
     neutre (forcer la saturation donnerait du rose). */
  const hsl=ntHsl(acc);
  const on=hsl[1]<0.15?kbMix(acc,white,0.75):ntHslRgb(hsl[0],Math.min(1,Math.max(0.85,hsl[1])),0.72);
  const t=c=>c.join(','),s=document.documentElement.style;
  s.setProperty('--mn-bg-rgb',t(kbMix(acc,black,0.94)));
  /* anthracite neutre, a peine teinte (liste et onglets) */
  s.setProperty('--mn-char-rgb',t(kbMix(acc,[30,31,36],0.96)));
  s.setProperty('--mn-acc-rgb',t(acc));
  s.setProperty('--mn-fill-rgb',t(fill));
  s.setProperty('--mn-hi-rgb',t(kbMix(fill,white,0.18)));
  s.setProperty('--mn-lo-rgb',t(kbMix(fill,black,0.5)));
  s.setProperty('--mn-on-rgb',t(on));
}
function ntSchedule(t){
  if(!(t.remaining>0))return;
  t.startedAt=Date.now();
  t.timeout=setTimeout(()=>dismissNt(t.id),t.remaining);
}
function dismissNt(id){
  const t=ntToasts[id];if(!t)return;
  delete ntToasts[id];clearTimeout(t.timeout);
  t.el.classList.add('leaving');
  setTimeout(()=>{if(t.el.parentNode)t.el.parentNode.removeChild(t.el)},240);
}
/* Signature inchangee (header,message,duration,type) : le Lua n'a rien a changer. */
function notify(header,message,duration,type){
  const level=NT_LEVELS.indexOf(type)>=0?type:'info';
  let dur=Number(duration);
  if(duration===undefined||duration===null||!isFinite(dur))dur=NT_DEFAULT;
  dur=dur<=0?0:Math.max(500,Math.min(60000,dur));
  const title=String(header==null?'':header),msg=String(message==null?'':message);
  if(!title&&!msg)return null;
  const id=ntNext++,el=document.createElement('div');
  el.className='nt-toast';el.setAttribute('data-level',level);
  el.setAttribute('role',level==='error'?'alert':'status');
  const icon=document.createElement('span');
  icon.className='nt-icon';icon.setAttribute('aria-hidden','true');
  icon.innerHTML=NT_ICONS[level];
  const body=document.createElement('div');body.className='nt-body';
  const tEl=document.createElement('p');tEl.className='nt-title';
  tEl.textContent=title||msg;body.appendChild(tEl);
  if(title&&msg){const mEl=document.createElement('p');mEl.className='nt-msg';mEl.textContent=msg;body.appendChild(mEl)}
  const close=document.createElement('button');
  close.type='button';close.className='nt-close';close.setAttribute('aria-label','Fermer');
  close.textContent='×';close.addEventListener('click',()=>dismissNt(id));
  el.append(icon,body,close);
  if(dur>0){
    const timer=document.createElement('span');
    timer.className='nt-timer';timer.setAttribute('aria-hidden','true');
    timer.style.animationDuration=dur+'ms';el.appendChild(timer);
  }
  const t={id,el,duration:dur,remaining:dur,startedAt:0,timeout:null};
  ntToasts[id]=t;
  el.addEventListener('mouseenter',()=>{
    if(!t.timeout)return;
    clearTimeout(t.timeout);t.timeout=null;t.remaining-=Date.now()-t.startedAt;
  });
  el.addEventListener('mouseleave',()=>{
    if(t.duration>0&&!t.timeout&&!el.classList.contains('leaving'))ntSchedule(t);
  });
  ntStack.insertBefore(el,ntStack.firstChild);
  ntSchedule(t);
  const ids=Object.keys(ntToasts).map(Number).sort((a,b)=>a-b);
  while(ids.length>NT_MAX)dismissNt(ids.shift());
  return id;
}
/* defaut = le vert de reference ; le Lua le remplace via setMenuColor */
ntApplyColor(84,150,96);mnApplyColor(84,150,96);

/* ================= MESSAGES DU JEU ================= */
addEventListener('message',e=>{
  let d=e.data||{};
  /* Lapsus.SendNuiMessage envoie une chaine JSON ; FiveM peut envoyer un
     objet. On accepte les deux, sinon aucune action n'arrivait. */
  if(typeof d==='string'){try{d=JSON.parse(d)}catch(_){return}}
  if(!d||typeof d!=='object')return;
  switch(d.action){
    /* ---- actions envoyees par menu.lua (pont interface <-> menu) ---- */
    case 'open':showMenu();break;
    case 'close':hideMenuNow();break;
    case 'setData':applyFrame(d.data);break;
    case 'theme':B.theme=String(d.name||'');document.documentElement.dataset.theme=B.theme;break;
    case 'key':onKey(d.key);break;
    case 'setKeybinds':renderKeybinds(d.rows);break;
    case 'showLoading':showLoading(d);break;
    case 'loadingProgress':loadingProgress(d);break;
    case 'hideLoading':hideLoading();break;
    case 'setBannerOffset':B.bannerOffset=Number(d.v)||0;applyBannerOffset();break;
    case 'designMode':document.documentElement.dataset.design=d.enabled?'on':'off';break;
    /* setUiScale : menu.lua applique deja l'echelle via setMenuPos
       (transform:scale glisse dans la valeur "y"). Zoome aussi ici
       doublerait la taille du panneau : on memorise seulement. */
    case 'setUiScale':B.uiScale=Number(d.scale)||1;break;
    case 'setCurrent':
      /* Lua encode un tableau Lua vide en {} (objet JS, pas tableau) : tel quel
         B.menu.forEach levait "n'est pas une fonction", le rendu s'arretait
         net et le compteur restait bloque sur 0/0. On normalise toujours. */
      B.cur=(parseInt(d.current,10)||1)-1;
      B.menu=(Array.isArray(d.menu)?d.menu:[]).filter(o=>o&&typeof o==='object');
      showMenu();break;
    case 'showMenu':d.visible?showMenu():hideMenuNow();break;
    case 'setTabs':B.tabs=d.tabs||[];B.tab=d.index;renderTabs();break;
    case 'setTabIndex':B.tab=d.index||0;renderTabs();break;
    case 'resetTabs':B.tabs=['Main Menu'];B.tab=0;renderTabs();break;
    case 'setMenuPos':
      if(d.x!==undefined)B.left=d.x+'vh';
      if(d.y!==undefined)B.top=d.y+'vh';
      if(live()){B.root.style.left=B.left;B.root.style.top=B.top;positionPlayerCard()}break;
    case 'setBanner':if(d.url){B.banner=d.url;if(live()){B.img.src=d.url;B.img.style.display='block'}}break;
    case 'setMenuColor':{
      /* canal invalide ou absent -> 150 ; borne a 0..255 pour que toutes les nuances restent calculables */
      const ch=v=>{const n=Math.round(Number(v));return isFinite(n)?clamp(n,0,255):150};
      const r=ch(d.r),g=ch(d.g),b=ch(d.b),s=document.documentElement.style;
      const lt=v=>Math.round(v+(255-v)*0.55);
      s.setProperty('--accent-rgb',`${r},${g},${b}`);
      s.setProperty('--accent-light',`${lt(r)},${lt(g)},${lt(b)}`);s.setProperty('--line-rgb',`${lt(r)},${lt(g)},${lt(b)}`);
      kbApplyColor(r,g,b);ntApplyColor(r,g,b);mnApplyColor(r,g,b);break}
    case 'setBreadcrumb':B.crumb=Array.isArray(d.parts)?d.parts:(d.path?String(d.path).split('>').map(s=>s.trim()):[]);renderCrumb();break;
    case 'setTabStyle':document.documentElement.dataset.tabs=d.style||'';break;
    case 'setSelectStyle':document.documentElement.dataset.select=d.style||'';break;
    case 'setEdgeStyle':document.documentElement.dataset.edge=d.style||'';break;
    case 'setTitleStyle':document.documentElement.dataset.title=d.style||'';renderCrumb();break;
    case 'setBgStyle':document.documentElement.dataset.bg=d.style||'';break;
    case 'showInputPrompt':{
      I.title=d.title;I.value=d.showInput?d.value:'';
      /* TOUTES les prompts passent par le panneau "Choose Menu Key" :
         keybinds ET saisie texte (Spawn Vehicle, URL, plaque...). Aucun
         <input> n'est nécessaire : c'est le Lua qui pousse le buffer et le
         curseur via updateInputPrompt. */
      const mode=d.mode||'typeable';
      K.title=I.title;K.value=I.value;K.mode=mode;
      K.cursor=d.cursor==null?String(I.value||'').length:d.cursor;
      K.hint=mode==='itemkeybind'?'Touche pour lier  ·  Échap pour annuler'
                                   :'Entrée pour valider  ·  Échap pour annuler';
      keyUI(!!d.showInput);inputUI(false);
      if(d.showInput)I.blocking=true;else unblock();break}
    case 'hideInputPrompt':inputUI(false);keyUI(false);unblock();break;
    case 'updateInputPrompt':{
      I.title=d.title;I.value=d.value;
      K.title=I.title;K.value=I.value;
      K.cursor=d.cursor==null?String(I.value||'').length:d.cursor;
      if(K.slot.els&&!K.slot.out)keyUI(true);
      else inputUI(!!I.slot.els&&!I.slot.out);
      break}
    case 'displayFreecam':
      /* d.options repart de zero quand une liste fraiche arrive : le Lua
         reinitialise son index en parallele, sinon les deux se desynchronisent
         des la deuxieme ouverture. */
      F.opts=d.options||[];
      if(d.options)F.h=0;
      F.wl=d.weaponOptions||F.wl;F.vl=d.vehicleOptions||F.vl;
      if(d.weaponIndex!==undefined)F.w=d.weaponIndex-1;
      if(d.vehicleIndex!==undefined)F.v=d.vehicleIndex-1;
      present(F.slot,!!d.visible,buildFreecam,planFreecam);renderFreecam();break;
    case 'updateWeapon':F.w=d.index-1;renderFreecam();break;
    case 'updateVehicle':F.v=d.index-1;renderFreecam();break;
    case 'scroll':
      if(F.opts.length){F.h=(F.h+(d.direction==='up'?-1:1)+F.opts.length)%F.opts.length;renderFreecam()}break;
    case 'displayCrosshair':crossUI(!!d.visible);break;
    case 'displayPlayerCard':playerCardShow(d);break;
    case 'setFooterUser':
      /* Nom affiche en bas a gauche du pied (JUL par defaut). */
      B.userName=String(d.name).slice(0,32);
      if(live()&&B.brandEl)B.brandEl.textContent=B.userName||'JUL';break;
    case 'setFooterLogo':{
      if(!d.url)break;
      B.logoUrl=String(d.url);
      applyFooterLogo(B.logoEl,B.logoUrl);break}
    case 'notify':notify(d.header||'Info',d.message,d.duration??4000,d.type||'info');break;
  }
});
/* Ecran de chargement au boot cote NUI : menu.lua envoie showLoading apres
   ~2 s, mais la page peut se charger plus tard et rater le message. On affiche
   donc l'ecran tout de suite ; hideLoading (ou le filet de securite de 9 s)
   le retire. En apercu fichier on ne l'affiche pas pour voir le menu tout de suite. */
if(location.protocol!=='file:')showLoading({status:'Chargement de l’interface...'});
/* ================= APERCU HORS JEU (fichier ouvert dans un navigateur) ================= */
if(location.protocol==='file:'){

    postMessage({action:'setTabs',tabs:['Main','Bypasses','Settings'],index:0},'*');
    postMessage({action:'setBreadcrumb',path:''},'*');

      {type:'submenu',label:'Self Options',icon:'ph-user'},

      {type:'submenu',label:'Weapon Options',icon:'ph-crosshair'},
      {type:'submenu',label:'Vehicle Options',icon:'ph-car'},
      {type:'checkbox',label:'Show Keybinds',checked:true},
      {type:'checkbox',label:'Show Spectators',checked:false},
      {type:'divider',label:'Other'},
      {type:'slider',label:'Opacity',value:60,min:0,max:100,step:1},
      {type:'scroll',label:'Theme',options:[{label:'Dark'},{label:'Light'},{label:'Auto'}],selected:1},
      {type:'color',label:'Accent',color:'#549660'},
      {type:'action',label:'Search'}
    ]},'*');
    postMessage({action:'displayPlayerCard',visible:true,data:{name:'Night-Raven',sid:204,dist:'312 m',hdg:128,dir:'SE',pos:'-1204, 86, 31',num:'5561234870',veh:'On foot',wep:'Unarmed',hpN:200,hpMax:200,apN:40}},'*');
    postMessage({action:'notify',header:'Preview',message:'Browser preview mode',type:'info',duration:5000},'*');
    postMessage({action:'setKeybinds',rows:[
      {label:'Menu',key:'M',state:'none'},
      {label:'Show Keybinds',key:'F5',state:'on'},
      {label:'Show Spectators',key:'F6',state:'off'}
    ]},'*');
  };
  setTimeout(go,50);
}
