(() => {
  'use strict';

  // ---------- NUI ----------
  const RES = typeof GetParentResourceName === 'function' ? GetParentResourceName() : null;

  function post(name, data) {
    if (!RES) return;
    fetch(`https://${RES}/${name}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify(data || {})
    }).catch(() => {});
  }

  // ---------- Éléments ----------
  const picker  = document.getElementById('picker');
  const sv      = document.getElementById('sv');
  const hueEl   = document.getElementById('hue');
  const alphaEl = document.getElementById('alpha');
  const svKnob    = document.getElementById('svKnob');
  const hueKnob   = document.getElementById('hueKnob');
  const alphaKnob = document.getElementById('alphaKnob');
  const hexIn   = document.getElementById('hex');
  const chans   = Array.from(document.querySelectorAll('.chan'));
  const rootStyle = document.documentElement.style;

  // ---------- État (H en degrés, S/V/A entre 0 et 1) ----------
  const state = { h: 14, s: 0, v: 1, a: 1 };

  const clamp = (n, min = 0, max = 1) => Math.min(max, Math.max(min, n));

  // ---------- Conversions ----------
  function hsvToRgb(h, s, v) {
    const f = (n) => {
      const k = (n + h / 60) % 6;
      return v - v * s * Math.max(Math.min(k, 4 - k, 1), 0);
    };
    return [f(5), f(3), f(1)].map((x) => Math.round(x * 255));
  }

  function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const d = max - min;
    let h = 0;
    if (d) {
      if (max === r)      h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else                h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return { h, s: max ? d / max : 0, v: max };
  }

  const toHex = (r, g, b) =>
    '#' + [r, g, b].map((x) => x.toString(16).padStart(2, '0')).join('').toUpperCase();

  function parseHex(str) {
    let h = String(str).trim().replace(/^#/, '');
    if (/^[0-9a-f]{3}$/i.test(h)) h = h.split('').map((c) => c + c).join('');
    if (!/^([0-9a-f]{6}|[0-9a-f]{8})$/i.test(h)) return null;
    return {
      r: parseInt(h.slice(0, 2), 16),
      g: parseInt(h.slice(2, 4), 16),
      b: parseInt(h.slice(4, 6), 16),
      a: h.length === 8 ? parseInt(h.slice(6, 8), 16) : null
    };
  }

  function setRgb(r, g, b, a) {
    const hsv = rgbToHsv(r, g, b);
    state.s = hsv.s;
    state.v = hsv.v;
    // On garde la teinte quand la couleur est grise ou noire (sinon elle saute)
    if (hsv.s > 0 && hsv.v > 0) state.h = hsv.h;
    if (a !== null && a !== undefined) state.a = clamp(a / 255);
  }

  function current() {
    const [r, g, b] = hsvToRgb(state.h, state.s, state.v);
    return { r, g, b, a: Math.round(state.a * 255), hex: toHex(r, g, b) };
  }

  // ---------- Rendu ----------
  function render(keep) {
    const c = current();
    rootStyle.setProperty('--hue-color', `hsl(${state.h}, 100%, 50%)`);
    rootStyle.setProperty('--solid', `rgb(${c.r}, ${c.g}, ${c.b})`);
    rootStyle.setProperty('--solid-0', `rgba(${c.r}, ${c.g}, ${c.b}, 0)`);
    rootStyle.setProperty('--rgba', `rgba(${c.r}, ${c.g}, ${c.b}, ${state.a})`);

    svKnob.style.left  = (state.s * 100) + '%';
    svKnob.style.top   = ((1 - state.v) * 100) + '%';
    hueKnob.style.top  = (state.h / 360 * 100) + '%';
    alphaKnob.style.left = (state.a * 100) + '%';

    if (keep !== hexIn) hexIn.value = c.hex;
    [c.r, c.g, c.b, c.a].forEach((val, i) => {
      if (keep !== chans[i]) chans[i].value = String(val);
    });
  }

  let raf = 0;
  function emit() {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      post('colorChange', current());
    });
  }

  function commit(keep) {
    render(keep);
    emit();
  }

  // ---------- Glisser (carré, teinte, alpha) ----------
  function drag(el, onMove) {
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      el.setPointerCapture(e.pointerId);

      const move = (ev) => {
        const r = el.getBoundingClientRect();
        onMove(clamp((ev.clientX - r.left) / r.width), clamp((ev.clientY - r.top) / r.height));
        commit();
      };
      const up = () => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
      };

      move(e);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      e.preventDefault();
    });
  }

  drag(sv,      (x, y) => { state.s = x; state.v = 1 - y; });
  drag(hueEl,   (x, y) => { state.h = y * 360; });
  drag(alphaEl, (x)    => { state.a = x; });

  // ---------- Clavier sur les curseurs ----------
  function keys(el, handler) {
    el.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 10 : 1;
      let dx = 0, dy = 0;
      if (e.key === 'ArrowLeft')  dx = -step;
      else if (e.key === 'ArrowRight') dx = step;
      else if (e.key === 'ArrowUp')    dy = -step;
      else if (e.key === 'ArrowDown')  dy = step;
      else return;
      e.preventDefault();
      handler(dx, dy);
      commit();
    });
  }

  keys(sv,      (dx, dy) => { state.s = clamp(state.s + dx / 100); state.v = clamp(state.v - dy / 100); });
  keys(hueEl,   (dx, dy) => { state.h = clamp(state.h + dy + dx, 0, 360); });
  keys(alphaEl, (dx, dy) => { state.a = clamp(state.a + (dx - dy) / 100); });

  // ---------- Champ Hex ----------
  hexIn.addEventListener('input', () => {
    const v = hexIn.value.trim().replace(/^#/, '');
    if (v.length !== 6 && v.length !== 8) return;
    const p = parseHex(v);
    if (!p) return;
    setRgb(p.r, p.g, p.b, p.a);
    commit(hexIn);
  });
  hexIn.addEventListener('change', () => {
    const p = parseHex(hexIn.value);
    if (p) setRgb(p.r, p.g, p.b, p.a);
    commit();
  });
  hexIn.addEventListener('blur', () => render());
  hexIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') hexIn.blur(); });

  // ---------- Champs R G B A ----------
  chans.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 3);
      if (inp.value === '') return;
      const n = Math.min(255, parseInt(inp.value, 10));
      if (String(n) !== inp.value && parseInt(inp.value, 10) > 255) inp.value = String(n);
      const c = current();
      const vals = [c.r, c.g, c.b, c.a];
      vals[i] = n;
      setRgb(vals[0], vals[1], vals[2], vals[3]);
      commit(inp);
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const step = (e.shiftKey ? 10 : 1) * (e.key === 'ArrowUp' ? 1 : -1);
        const cur = parseInt(inp.value || '0', 10) || 0;
        inp.value = String(clamp(cur + step, 0, 255));
        inp.dispatchEvent(new Event('input'));
      } else if (e.key === 'Enter') {
        inp.blur();
      }
    });
    inp.addEventListener('blur', () => render());
  });

  // Sélectionne tout le contenu au clic dans un champ
  [hexIn, ...chans].forEach((inp) => {
    inp.addEventListener('focus', () => setTimeout(() => inp.select(), 0));
  });

  // ---------- Affichage ----------
  function show() {
    const d = window.__cpData || {};
    const vh = window.innerHeight / 100;
    const menuX = (d.menuX !== undefined) ? d.menuX : 20.25;
    const menuY = (d.menuY !== undefined) ? d.menuY : 19.5;
    const x = menuX * vh;
    const y = menuY * vh;
    const w = 37 * vh;
    const h = 40 * vh;
    const r = { top: y, left: x, right: x + w, bottom: y + h, height: h, width: w };
    if (r) {
      const gap = 8;
      const top = r.top + (r.height - picker.offsetHeight) / 2;
      const left = r.right + gap;
      picker.style.top = Math.max(8, top) + 'px';
      picker.style.left = Math.max(8, left) + 'px';
      picker.style.transform = 'none';
    } else {
      picker.style.top = '50%';
      picker.style.left = '50%';
      picker.style.transform = 'translate(-50%, -50%) scale(1)';
    }
    picker.classList.add('show');
    document.documentElement.style.cursor = 'default';
    setTimeout(function(){
      const btn = document.getElementById('cpDone');
      if (btn) {
        const r = btn.getBoundingClientRect();
        post('colorPickerButtonRect', { x: r.left, y: r.top, w: r.width, h: r.height });
      }
    }, 0);
  }
  function hide() { picker.classList.remove('show'); document.documentElement.style.cursor = ''; }

  function closePicker() {
    hide();
    post('colorPickerDone', current());
  }
  window.__cpClose = closePicker;

  const cpDoneBtn = document.getElementById('cpDone');
  if (cpDoneBtn) {
    cpDoneBtn.addEventListener('click', closePicker);
    cpDoneBtn.addEventListener('mousedown', function(e){ e.preventDefault(); e.stopPropagation(); });
    cpDoneBtn.addEventListener('mouseup', function(e){ e.preventDefault(); e.stopPropagation(); closePicker(); });
  }
  picker.addEventListener('click', function(e){
    if (e.target && e.target.id === 'cpDone') closePicker();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && RES && picker.classList.contains('show')) closePicker();
  });
  window.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- Messages venant du Lua ----------
  function applyColor(c) {
    if (!c) return;
    if (typeof c === 'string') {
      const p = parseHex(c);
      if (p) setRgb(p.r, p.g, p.b, p.a);
    } else if (c.hex) {
      const p = parseHex(c.hex);
      if (p) setRgb(p.r, p.g, p.b, p.a !== null ? p.a : (c.a !== undefined ? c.a : null));
    } else if (c.r !== undefined) {
      setRgb(clamp(+c.r, 0, 255), clamp(+c.g, 0, 255), clamp(+c.b, 0, 255), c.a !== undefined ? clamp(+c.a, 0, 255) : 255);
    }
    render();
  }

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.action === 'openColorPicker')          { window.__cpData = d; applyColor(d.color); show(); }
    else if (d.action === 'closeColorPicker')    { hide(); }
    else if (d.action === 'setColorPicker') { applyColor(d.color); }
  });

  // ---------- Démarrage ----------
  render();
  if (!RES) {
    document.body.classList.add('preview');
  }
})();
</script>
</body>
</html>
