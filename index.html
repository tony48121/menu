<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>JUL UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --accent: #b9bdc9;
    --accent-rgb: 185, 189, 201;
    --bg: #08080a;
    --bg-2: #0e0e11;
    --line: rgba(255, 255, 255, .07);
    --text: #f1f2f6;
    --muted: #6f7280;
    --opacity: 1;
    --scale: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text); font-size: 13.5px;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  /* Fond visible uniquement en mode démo (navigateur) */
  body.demo {
    background: transparent;
  }

  #root {
    position: fixed; top: 40px; left: 56px; width: 400px;
    transform-origin: top left; transform: scale(var(--scale)); opacity: var(--opacity);
    display: flex; flex-direction: column; gap: 6px;
  }
  #root.hidden { display: none; }
  #root.open .card { animation: open .22s cubic-bezier(.2, .8, .3, 1) both; }
  #root.open .card.c2 { animation-delay: .04s; }
  @keyframes open { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .card {
    position: relative; background: var(--bg);
    border: 1px solid rgba(255, 255, 255, .1); border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .6);
  }

  /* ---------- Bannière ---------- */
  .banner { position: relative; height: 108px; overflow: hidden; border-radius: 11px 11px 0 0; background: #050506; }
  .b-chrome { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

  /* Chrome (style brossé argenté) */
  .b-chrome {
    background:
      linear-gradient(112deg, transparent 0 34%, rgba(255,255,255,.10) 44%, rgba(255,255,255,.55) 49%, rgba(255,255,255,.06) 55%, transparent 64%),
      linear-gradient(135deg, #050506 0%, #17181c 45%, #2a2c33 62%, #0a0a0c 100%);
  }
  .b-chrome::before {
    content: ""; position: absolute; right: -10px; top: 0; bottom: 0; width: 150px;
    background: linear-gradient(120deg, #e9ebf0, #6c707b 55%, #c9ccd5);
    clip-path: polygon(46% 0, 100% 0, 100% 100%, 0 100%); opacity: .5;
  }
  .b-chrome::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 70px;
    background: linear-gradient(60deg, #9fa3ae, #2d2f36);
    clip-path: polygon(0 0, 100% 0, 0 100%); opacity: .35;
  }
  .brand { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; transform: skewX(-7deg); }
  .brand .row1 { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 40px; height: 40px; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .8)); }
  .brand b {
    font-size: 35px; font-weight: 900; letter-spacing: .03em; line-height: 1;
    background: linear-gradient(180deg, #fff 0%, #d4d7e0 42%, #6b6f7b 52%, #eceef3 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .9));
  }
  .brand small { font-size: 11px; font-weight: 700; letter-spacing: .55em; margin-left: .55em; color: #eceef3; }


  .crumb {
    padding: 8px 10px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: #fff; background: #000; border-top: 1px solid rgba(255,255,255,.14); border-bottom: 1px solid rgba(255,255,255,.14);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .crumb i { font-style: normal; margin: 0 6px; opacity: .6; }
  .crumb i::before { content: "›"; }
  .crumb:not(.show) { display: none; }

  /* ---------- Onglets ---------- */
  .tabs { display: flex; background: var(--bg-2); border-radius: 0 0 11px 11px; overflow: hidden; }
  .tabs.off { display: none; }
  .crumb.solo { border-radius: 0 0 11px 11px; border-bottom: 0; }
  .tab {
    flex: 1; text-align: center; padding: 12px 2px; cursor: pointer;
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    transition: color .15s, background .15s; border-bottom: 2px solid transparent;
  }
  .tab:hover { color: #c9ccd6; }
  .tab.active {
    color: #fff; background: linear-gradient(180deg, #34353b, #1d1d22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12); border-bottom-color: rgba(var(--accent-rgb), .9);
  }

  /* ---------- Liste ---------- */
  .c2 { background: var(--bg); }
  .list { position: relative; max-height: 340px; overflow-y: auto; scrollbar-width: none; padding: 6px 0; border-radius: 11px 11px 0 0; }
  .list::-webkit-scrollbar { display: none; }
  .sb { position: absolute; left: -14px; top: 6px; height: 300px; width: 4px; border-radius: 2px; background: rgba(255,255,255,.14); display: block; z-index: 2; }
  .sb i { position: absolute; left: 0; right: 0; top: 0; height: 100%; border-radius: 2px; background: rgba(255,255,255,.8); box-shadow: 0 0 6px rgba(255,255,255,.35);  transition: top .16s ease-out, height .16s ease-out; }

  .row {
    position: relative; display: flex; align-items: center; gap: 11px;
    height: 37px; margin: 0 8px; padding: 0 10px; cursor: pointer;
    border: 1px solid transparent; border-bottom-color: var(--line); border-radius: 9px;
  }
  .row.sel {
    border-color: transparent;
    background: linear-gradient(90deg, rgba(255,255,255,.24), rgba(255,255,255,.05));
    box-shadow: 0 0 6px rgba(var(--accent-rgb), .18), inset 0 0 12px rgba(255,255,255,.06);
  }
  /* Filet continu de 1 px (dégradé) autour de la ligne sélectionnée — dessiné en masque pour éviter toute coupure */
  .row.sel::before {
    content: ""; position: absolute; inset: -1px; padding: 1px; border-radius: inherit; pointer-events: none;
    background: var(--ring, linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 55%),
                            linear-gradient(100deg, rgba(var(--accent-rgb), .95), rgba(var(--accent-rgb), .3) 40%, rgba(var(--accent-rgb), .3) 62%, rgba(var(--accent-rgb), .95)));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  .row .ico { width: 17px; height: 17px; flex: none; color: #c9ccd6; }
  .row .lbl { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .lbl em { font-style: normal; color: var(--muted); margin-left: 7px; font-size: 12.5px; }
  .row.sel .lbl em { color: #c9ccd6; }
  .row .chev { width: 15px; height: 15px; color: #8c90a0; flex: none; }
  .row.sel .chev { color: #fff; }
  .row .plus { width: 14px; height: 14px; color: #8c90a0; flex: none; }
  .row.sel .plus { color: #fff; }
  .row .val { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; width: 34px; text-align: right; flex: none; }
  .row.sel .val { color: #e3e5ec; }

  .section { display: flex; align-items: center; gap: 12px; height: 32px; margin: 0 8px; padding: 0 2px; color: #b4b7c3; font-size: 11.5px; font-weight: 600; pointer-events: none; }
  .section::before, .section::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.28); }
  .section::before { flex: 1; } .section::after { flex: 1; }

  /* Interrupteur */
  .sw { width: 36px; height: 20px; border-radius: 10px; background: #2c2c33; position: relative; flex: none; transition: background .18s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #d7d9e0; transition: transform .18s cubic-bezier(.3, .8, .3, 1); }
  .sw.on { background: rgba(var(--accent-rgb), .85); box-shadow: 0 0 10px rgba(var(--accent-rgb), .35); }
  .sw.on::after { transform: translateX(16px); background: #fff; }

  /* Curseur */
  .slider { width: 92px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.14); position: relative; flex: none; }
  .slider i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: rgba(var(--accent-rgb), .9); }
  .slider i::after { content: ""; position: absolute; right: -2px; top: -4px; width: 4px; height: 11px; border-radius: 2px; background: #fff; }

  /* Sélecteur « — VALEUR — » */
  .pick { display: flex; align-items: center; gap: 7px; color: #9a9eae; font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
  .pick::before, .pick::after { content: ""; width: 7px; height: 1px; background: currentColor; opacity: .8; }
  .row.sel .pick { color: #fff; }

  .empty { padding: 34px 16px; text-align: center; color: var(--muted); }

  /* ---------- Pied ---------- */
  .foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 14px; height: 46px; border-top: 1px solid rgba(255,255,255,.1); border-radius: 0 0 11px 11px; background: #050507; }
  .who { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: linear-gradient(135deg, #e9ebf0, #5d616d); color: #0a0a0c; font-size: 11px; font-weight: 800; }
  .who b { font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mid { display: flex; align-items: center; justify-content: center; }
  .mark { width: 20px; height: 20px; opacity: .9; }

  #count { justify-self: end; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: #e3e5ec; }

  .hints { display: flex; justify-content: center; gap: 14px; padding: 7px 10px 9px; color: var(--muted); font-size: 10.5px; border-top: 1px solid var(--line); border-radius: 0 0 11px 11px; }
  .hints b { color: #c9ccd6; font-weight: 600; margin-right: 4px; }
  .hints.off { display: none; }
  .foot.alone { border-radius: 0 0 11px 11px; }

  .toast { margin-top: 10px; padding: 9px 14px; font-size: 12.5px; border-radius: 10px; background: var(--bg); border: 1px solid rgba(var(--accent-rgb), .55); color: var(--text); opacity: 0; transform: translateY(-4px); transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }


  /* =====================================================================
     STYLE SYNAPS
     ===================================================================== */


  /* ---------- SYNAPS : chrome, lignes détaillées, sélection lumineuse ---------- */
  #root[data-style="synaps"] { gap: 0; }
  #root[data-style="synaps"] .c1 { border-radius: 12px 12px 0 0; border-bottom: 0; }
  #root[data-style="synaps"] .c2 { border-radius: 0 0 12px 12px; border-top: 0; }
  #root[data-style="synaps"] .tabs, #root[data-style="synaps"] .list { border-radius: 0; }
  #root[data-style="synaps"] .tabs { border-bottom: 1px solid rgba(255,255,255,.12); }
  #root[data-style="synaps"] .card { background: rgba(0,0,0,.78); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); border-color: rgba(255,255,255,.12); }
  #root[data-style="synaps"] .c2 { background: rgba(0,0,0,.72); }
  #root[data-style="synaps"] .banner { height: 118px; }
  #root[data-style="synaps"] .brand b { font-size: 40px; }
  #root[data-style="synaps"] .brand svg { width: 46px; height: 46px; }
  #root[data-style="synaps"] .crumb { background: rgba(0,0,0,.85); color: #fff; font-size: 11px; letter-spacing: .1em; border-color: rgba(255,255,255,.55); }
  #root[data-style="synaps"] .crumb i::before { content: ">"; }
  #root[data-style="synaps"] .tabs { background: rgba(255,255,255,.04); }
  #root[data-style="synaps"] .tab { color: #5d6070; font-size: 11.5px; padding: 13px 2px; border-bottom: 0; }
  #root[data-style="synaps"] .tab.active { color: #fff; background: linear-gradient(180deg, #4a4b52, #2a2b30); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 10px rgba(255,255,255,.12); }
  #root[data-style="synaps"] .list { padding: 4px 0; }
  #root[data-style="synaps"] .row { height: 36px; margin: 0 7px; border-bottom-color: rgba(255,255,255,.1); }
  #root[data-style="synaps"] .row.sel {
    border-color: transparent;
    background: linear-gradient(90deg, #6c6d75 0%, #46474d 42%, #2a2b30 100%);
    box-shadow: 0 0 6px rgba(255,255,255,.16), inset 0 0 12px rgba(255,255,255,.07);
    --ring: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%),
            linear-gradient(100deg, rgba(255,255,255,.9), rgba(255,255,255,.28) 38%, rgba(255,255,255,.28) 64%, rgba(255,255,255,.85));
  }
  #root[data-style="synaps"] .row .lbl { font-weight: 500; }
  #root[data-style="synaps"] .section { height: 30px; color: #fff; font-size: 11px; }
  #root[data-style="synaps"] .section::before, #root[data-style="synaps"] .section::after { background: rgba(255,255,255,.7); }
  #root[data-style="synaps"] .sw { background: #3a3b41; }
  #root[data-style="synaps"] .sw::after { background: #f2f3f6; }
  #root[data-style="synaps"] .sw.on { background: #c9cacf; box-shadow: none; }
  #root[data-style="synaps"] .slider { background: rgba(255,255,255,.16); }
  #root[data-style="synaps"] .slider i { background: rgba(255,255,255,.75); }
  #root[data-style="synaps"] .pick::before, #root[data-style="synaps"] .pick::after { width: 8px; }
  #root[data-style="synaps"] .foot { background: rgba(0,0,0,.6); }
  #root[data-style="synaps"] .avatar { display: none; }
  #root[data-style="synaps"] .who b { font-size: 12.5px; font-weight: 600; }
  #root[data-style="synaps"] .hints { display: none; }
  #root[data-style="synaps"] .foot { border-radius: 0 0 11px 11px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="root" class="hidden" data-style="synaps">
  <div class="card c1">
    <div class="banner">
      <div class="b-chrome">
        <div class="brand">
          <div class="row1">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M14 6h20v18c0 6.6-5.4 12-12 12h-2C13.4 36 8 30.6 8 24v-2h10v2c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2V12H14z" fill="url(#gm)"/>
              <defs><linearGradient id="gm" x1="6" y1="6" x2="34" y2="34"><stop stop-color="#fff"/><stop offset=".55" stop-color="#8a8e9a"/><stop offset="1" stop-color="#e6e8ee"/></linearGradient></defs>
            </svg>
            <b>JUL</b>
          </div>
          <small>MENU</small>
        </div>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="card c2">
    <div class="sb" id="sb"><i></i></div>
    <div class="list" id="list"></div>
    <div class="foot">
      <div class="who"><div class="avatar" id="avatar">N</div><b id="who">JUL</b></div>
      <div class="mid"><svg class="mark" viewBox="0 0 40 40" fill="#e3e5ec"><path d="M14 6h20v18c0 6.6-5.4 12-12 12h-2C13.4 36 8 30.6 8 24v-2h10v2c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2V12H14z"/></svg></div>
      <div id="count">1 / 1</div>
    </div>
    <div class="hints" id="hints">
      <span><b>↑↓</b>naviguer</span><span><b>←→</b>valeur</span><span><b>Entrée</b>valider</span><span><b>Retour</b>revenir</span>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =====================================================================
   JUL UI — interface NUI
   - En jeu : le script Lua pilote le menu avec SendNUIMessage
   - Dans un navigateur : mode démo automatique (clavier + souris)
   ===================================================================== */

const IN_GAME = typeof GetParentResourceName === 'function';
const DEMO = !IN_GAME || new URLSearchParams(location.search).has('demo');

/* ---------- Icônes (SVG en trait) ---------- */
const P = {
  user:   '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  users:  '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.6 3-6 7-6s7 2.4 7 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.5c2.4.6 4 2.4 4 5.5"/>',
  eye:    '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  bell:   '<path d="M6 16V11a6 6 0 1112 0v5l2 2H4z"/><path d="M10 21h4"/>',
  globe:  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  keys:   '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h0M10 10h0M14 10h0M18 10h0M7 14h10"/>',
  palette:'<path d="M12 3a9 9 0 100 18c1.5 0 2-1 1.5-2.2-.5-1.3.3-2.3 1.7-2.3H18a3 3 0 003-3c0-5-4-10.5-9-10.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  gear:   '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  car:    '<path d="M4 16V12l2-5h12l2 5v4"/><path d="M3 16h18v3H3z"/>',
  crown:  '<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',
  list:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/>',
  chevR:  '<path d="M9 6l6 6-6 6"/>',
  dbl:    '<path d="M6 6l6 6-6 6M13 6l6 6-6 6"/>',
  plus:   '<path d="M12 5v14M5 12h14"/>'
};
const svg = (n, c = '') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n] || ''}</svg>`;

/* ---------- Thèmes ---------- */
const THEMES = {
  'Argent':   ['#b9bdc9', '185, 189, 201'],
  'Indigo':   ['#7c6cff', '124, 108, 255'],
  'Cyan':     ['#2fc4ff', '47, 196, 255'],
  'Émeraude': ['#2fd08a', '47, 208, 138'],
  'Rose':     ['#ff5c8a', '255, 92, 138'],
  'Ambre':    ['#ffb02e', '255, 176, 46'],
  'Rouge':    ['#ff2a2a', '255, 42, 42'],
  'Bleu':     ['#1ea7e8', '30, 167, 232']
};
function applyTheme(name) {
  const t = THEMES[name]; if (!t) return;
  const r = document.documentElement.style;
  r.setProperty('--accent', t[0]); r.setProperty('--accent-rgb', t[1]);
}

/* ---------- Données du menu (remplaçables par Lua via 'setData') ----------
   Types : menu (avec items OU tabs) | toggle | slider (+ enabled optionnel) | select | button | section
   Un menu peut avoir ses propres onglets : { type = 'menu', label = '…', tabs = { { label = '…', items = { … } }, … } }
   Champs optionnels : icon, count
   --------------------------------------------------------------------- */
let DATA = {
  title: 'JUL',
  user: 'Joueur',
  tabs: [
    { label: 'Principal', items: [
      { type: 'menu', id: 'profil', label: 'Profil', icon: 'user', tabs: [
        { label: 'Identité', items: [
          { type: 'section', label: 'Compte' },
          { type: 'button', id: 'pseudo', label: 'Modifier le pseudo', count: 1 },
          { type: 'toggle', id: 'prive', label: 'Profil privé', value: false },
          { type: 'select', id: 'langue', label: 'Langue', options: ['Français', 'English', 'Español', 'Deutsch'], index: 0 }
        ]},
        { label: 'Sons', items: [
          { type: 'section', label: 'Volumes' },
          { type: 'slider', id: 'volume', label: 'Volume des sons', min: 0, max: 100, step: 5, value: 60, enabled: true },
          { type: 'slider', id: 'musique', label: 'Musique', min: 0, max: 100, step: 5, value: 35, enabled: false }
        ]},
        { label: 'Avancé', items: [
          { type: 'toggle', id: 'p_stats', label: 'Afficher les statistiques', value: false },
          { type: 'button', id: 'p_reset', label: 'Réinitialiser le profil' }
        ]}
      ]},
      { type: 'menu', id: 'affichage', label: 'Affichage', icon: 'eye', tabs: [
        { label: 'Écran', items: [
          { type: 'toggle', id: 'minimap', label: 'Mini-carte', value: true },
          { type: 'toggle', id: 'horloge', label: 'Horloge', value: true }
        ]},
        { label: 'Caméra', items: [
          { type: 'slider', id: 'fov', label: 'Champ de vision', min: 40, max: 110, step: 1, value: 75, enabled: true },
          { type: 'slider', id: 'flou', label: 'Flou de mouvement', min: 0, max: 10, step: 1, value: 0, enabled: false }
        ]}
      ]},
      { type: 'menu', id: 'notifs', label: 'Notifications', icon: 'bell', items: [
        { type: 'toggle', id: 'n_son', label: 'Son', value: true },
        { type: 'select', id: 'n_pos', label: 'Position', options: ['Haut droite', 'Haut gauche', 'Bas droite'], index: 0 },
        { type: 'slider', id: 'n_dur', label: 'Durée (s)', min: 1, max: 10, step: 1, value: 4 }
      ]},
      { type: 'menu', id: 'raccourcis', label: 'Raccourcis', icon: 'keys', items: [
        { type: 'button', id: 'k1', label: 'Ouvrir le menu : F5' },
        { type: 'button', id: 'k2', label: 'Fermer le menu : Retour' }
      ]},
      { type: 'menu', id: 'vehicules', label: 'Véhicules', icon: 'car', items: [
        { type: 'toggle', id: 'v_ceinture', label: 'Rappel de ceinture', value: true },
        { type: 'select', id: 'v_unite', label: 'Unité de vitesse', options: ['km/h', 'mph'], index: 0 }
      ]},
      { type: 'menu', id: 'securite', label: 'Sécurité', icon: 'shield', items: [
        { type: 'toggle', id: 's_conf', label: 'Confirmer les actions', value: true }
      ]},
      { type: 'menu', id: 'journal', label: 'Journal', icon: 'list', items: [
        { type: 'button', id: 'j1', label: 'Exporter' }
      ]}
    ]},
    { label: 'Interface', items: [
      { type: 'section', label: 'Fenêtre' },
      { type: 'toggle', id: 'o_anim', label: 'Animations', value: true },
      { type: 'slider', id: 'o_vit', label: 'Vitesse d’animation', min: 0, max: 5, step: 0.5, value: 1.5, enabled: true },
      { type: 'select', id: 'o_trans', label: 'Transition', options: ['Douce', 'Rapide', 'Aucune'], index: 0 },
      { type: 'section', label: 'Contenu' },
      { type: 'button', id: 'o_reset', label: 'Réinitialiser la liste', count: 3 },
      { type: 'toggle', id: 'o_astuces', label: 'Afficher les astuces', value: false },
      { type: 'slider', id: 'o_txt', label: 'Taille du texte', min: 10, max: 20, step: 1, value: 14 },
      { type: 'toggle', id: 'o_compact', label: 'Lignes compactes', value: false }
    ]},
    { label: 'Audio', items: [
      { type: 'section', label: 'Volumes' },
      { type: 'slider', id: 'a_gen', label: 'Général', min: 0, max: 100, step: 5, value: 80, enabled: true },
      { type: 'slider', id: 'a_mus', label: 'Musique', min: 0, max: 100, step: 5, value: 40, enabled: true },
      { type: 'slider', id: 'a_fx', label: 'Effets', min: 0, max: 100, step: 5, value: 65, enabled: true },
      { type: 'section', label: 'Sortie' },
      { type: 'select', id: 'a_mode', label: 'Mode', options: ['Stéréo', 'Mono', 'Casque'], index: 0 }
    ]},
    { label: 'Thème', items: [
      { type: 'section', label: 'Couleurs' },
      { type: 'select', id: 'theme', label: 'Couleur d’accent', options: Object.keys(THEMES), index: 0 },
      { type: 'section', label: 'Fenêtre' },
      { type: 'slider', id: 'opacite', label: 'Opacité', min: 40, max: 100, step: 5, value: 100 },
      { type: 'slider', id: 'echelle', label: 'Taille', min: 70, max: 130, step: 5, value: 100 },
      { type: 'toggle', id: 'aide', label: 'Barre de raccourcis', value: true }
    ]}
  ]
};

/* ---------- État ---------- */
const $ = id => document.getElementById(id);
const S = { tab: 0, stack: [], open: false };

const curTab = () => DATA.tabs[S.tab];
/* Contexte d'onglets : ceux du menu principal, ou ceux d'un sous-menu qui en définit (menu.tabs) */
function ctx() {
  if (!S.stack.length) return { tabs: DATA.tabs, get i() { return S.tab; }, set i(v) { S.tab = v; } };
  const top = S.stack[S.stack.length - 1];
  return top.tabs ? { tabs: top.tabs, get i() { return top.tab; }, set i(v) { top.tab = v; } } : null;
}
function frame() {
  const c = ctx();
  if (c) {
    const t = c.tabs[c.i];
    return t._f || (t._f = { title: t.label, items: t.items, index: firstSel(t.items) });
  }
  return S.stack[S.stack.length - 1];
}
const selectable = items => items.filter(i => i.type !== 'section');
function firstSel(items) { return Math.max(0, items.findIndex(i => i.type !== 'section')); }
function step(dir) {
  const f = frame(), n = f.items.length; let i = f.index;
  for (let k = 0; k < n; k++) {
    i = (i + dir + n) % n;
    if (f.items[i].type !== 'section') { f.index = i; break; }
  }
  render();
}

/* ---------- Rendu ---------- */
function render() {
  const f = frame(), c = ctx();

  $('tabs').classList.toggle('off', !c);
  $('tabs').innerHTML = c ? c.tabs.map((t, i) => `<div class="tab ${i === c.i ? 'active' : ''}" data-t="${i}">${t.label}</div>`).join('') : '';

  const l = $('list'), st = l.scrollTop;
  l.innerHTML = f.items.length ? f.items.map((it, i) => rowHTML(it, i === f.index, i)).join('') : '<div class="empty">Aucun élément</div>';
  l.scrollTop = st;
  const s = l.querySelector('.sel');
  if (s) {
    const t = s.offsetTop, b = t + s.offsetHeight;
    if (t < l.scrollTop + 34) l.scrollTop = Math.max(0, t - 34);
    else if (b > l.scrollTop + l.clientHeight - 8) l.scrollTop = b - l.clientHeight + 8;
  }
  updateSB();

  const sels = selectable(f.items);
  $('count').textContent = `${Math.max(1, sels.indexOf(f.items[f.index]) + 1)} / ${sels.length}`;
  $('who').textContent = DATA.user || 'JUL';
  $('avatar').textContent = (DATA.user || 'N')[0].toUpperCase();
}

function rowHTML(it, sel, i) {
  if (it.type === 'section') return `<div class="section">${it.label}</div>`;
  let right = '';
  switch (it.type) {
    case 'menu':   right = svg('chevR', 'chev'); break;
    case 'button': right = svg('plus', 'plus'); break;
    case 'toggle': right = `<div class="sw ${it.value ? 'on' : ''}"></div>`; break;
    case 'slider': {
      const pct = (it.value - it.min) / (it.max - it.min) * 100;
      right = `<div class="slider"><i style="width:${pct}%"></i></div><div class="val">${it.value}</div>` +
              (it.enabled !== undefined ? `<div class="sw ${it.enabled ? 'on' : ''}"></div>` : '');
      break;
    }
    case 'select': right = `<div class="pick">${it.options[it.index]}</div>`; break;
  }
  const cnt = it.count !== undefined ? `<em>(${it.count})</em>` : '';
  return `<div class="row ${sel ? 'sel' : ''}" data-i="${i}">${it.icon ? svg(it.icon, 'ico') : ''}<div class="lbl">${it.label}${cnt}</div>${right}</div>`;
}

function updateSB() {
  const l = $('list'), sb = $('sb'), th = sb.firstElementChild;
  /* la barre couvre la hauteur de la liste et son curseur suit l'élément sélectionné */
  sb.style.top = (l.offsetTop + 6) + 'px';
  sb.style.height = Math.max(20, l.clientHeight - 12) + 'px';
  const f = frame(), sels = selectable(f.items), n = sels.length;
  const k = Math.max(0, sels.indexOf(f.items[f.index])), track = sb.clientHeight;
  if (n < 2) { th.style.top = '0px'; th.style.height = '100%'; return; }
  const h = Math.max(26, track / n);
  th.style.height = h + 'px';
  th.style.top = (k / (n - 1)) * (track - h) + 'px';
}
$('list').addEventListener('scroll', updateSB);

/* ---------- Actions ---------- */
function post(name, data = {}) {
  if (!IN_GAME) return;
  fetch(`https://${GetParentResourceName()}/${name}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(data)
  }).catch(() => {});
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function applyLocal(it) {
  switch (it.id) {
    case 'theme':   applyTheme(it.options[it.index]); break;
    case 'opacite': document.documentElement.style.setProperty('--opacity', it.value / 100); break;
    case 'echelle': document.documentElement.style.setProperty('--scale', it.value / 100); break;
    case 'aide':    $('hints').classList.toggle('off', !it.value); break;
  }
}
function change(dir) {
  const it = frame().items[frame().index]; if (!it) return;
  if (it.type === 'toggle') it.value = !it.value;
  else if (it.type === 'slider') it.value = Math.round(Math.min(it.max, Math.max(it.min, it.value + dir * it.step)) * 100) / 100;
  else if (it.type === 'select') it.index = (it.index + dir + it.options.length) % it.options.length;
  else return;
  applyLocal(it); render();
  post('change', { id: it.id, value: it.type === 'select' ? it.options[it.index] : it.value, index: it.index });
}
function activate() {
  const it = frame().items[frame().index]; if (!it) return;
  if (it.type === 'menu') {
    if (it.tabs) { it.tabs.forEach(t => delete t._f); S.stack.push({ title: it.label, tabs: it.tabs, tab: 0 }); }
    else S.stack.push({ title: it.label, items: it.items, index: firstSel(it.items) });
    render(); post('enter', { id: it.id });
  }
  else if (it.type === 'toggle' || it.type === 'select') change(1);
  else if (it.type === 'slider' && it.enabled !== undefined) { it.enabled = !it.enabled; render(); post('change', { id: it.id, enabled: it.enabled, value: it.value }); }
  else if (it.type === 'button') { post('select', { id: it.id }); if (DEMO) toast(`Action : ${it.label}`); }
}
function back() {
  if (S.stack.length) { S.stack.pop(); render(); post('back'); }
  else { closeMenu(); post('close'); }
}
function tab(dir) {
  const c = ctx(); if (!c) return;
  c.i = (c.i + dir + c.tabs.length) % c.tabs.length; render(); post('tab', { index: c.i, depth: S.stack.length });
}
function openMenu() { S.open = true; const r = $('root'); r.classList.remove('hidden', 'open'); void r.offsetWidth; r.classList.add('open'); render(); }
function closeMenu() { S.open = false; $('root').classList.add('hidden'); }

/* ---------- Entrées ---------- */
const KEYS = {
  ArrowUp: () => step(-1), ArrowDown: () => step(1),
  ArrowLeft: () => change(-1), ArrowRight: () => change(1),
  Enter: activate, Backspace: back, Escape: back,
  KeyA: () => tab(-1), KeyQ: () => tab(-1), KeyE: () => tab(1)
};
document.addEventListener('keydown', e => { const fn = KEYS[e.code]; if (fn && S.open) { e.preventDefault(); fn(); } });

$('list').addEventListener('mousemove', e => {
  const r = e.target.closest('.row'); if (!r) return;
  const i = +r.dataset.i, f = frame(); if (f.index !== i) { f.index = i; render(); }
});
$('list').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r) return;
  const it = frame().items[+r.dataset.i], box = r.getBoundingClientRect();
  if (it.type === 'slider') {
    if (it.enabled !== undefined && e.target.closest('.sw')) activate();
    else change(e.clientX < box.left + box.width * .6 ? -1 : 1);
  } else if (it.type === 'select') change(e.clientX < box.left + box.width * .75 ? -1 : 1);
  else activate();
});
$('list').addEventListener('wheel', e => { e.preventDefault(); step(e.deltaY > 0 ? 1 : -1); }, { passive: false });
$('tabs').addEventListener('click', e => { const t = e.target.closest('.tab'), c = ctx(); if (!t || !c) return; c.i = +t.dataset.t; render(); post('tab', { index: c.i, depth: S.stack.length }); });

/* ---------- Messages Lua → NUI ----------
   SendNUIMessage({ action = 'open' })
   SendNUIMessage({ action = 'close' })
   SendNUIMessage({ action = 'setData', data = { title = 'JUL', user = '…', tabs = { … } } })
   SendNUIMessage({ action = 'key', key = 'up' })   -- up, down, left, right, enter, back, tabPrev, tabNext
   SendNUIMessage({ action = 'theme', name = 'Cyan' })
   --------------------------------------------------------------------- */
window.addEventListener('message', ({ data: m }) => {
  switch (m.action) {
    case 'open': openMenu(); break;
    case 'close': closeMenu(); break;
    case 'setData': DATA = m.data; S.tab = 0; S.stack = []; render(); break;
    case 'theme': applyTheme(m.name); break;
    case 'notify': toast(String(m.message || '')); break;
    case 'key': ({ up: () => step(-1), down: () => step(1), left: () => change(-1), right: () => change(1),
                   enter: activate, back, tabPrev: () => tab(-1), tabNext: () => tab(1) })[m.key]?.(); break;
  }
});

/* ---------- Démarrage ---------- */
if (DEMO) { document.body.classList.add('demo'); openMenu(); toast('Mode démo : flèches, Entrée, Retour, A / E'); }
</script>
